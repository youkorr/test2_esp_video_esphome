# ========================================================================
# CONFIGURATION MANQUANTE À AJOUTER DANS P4MINI.YAML
# ========================================================================
# Ces sections sont OBLIGATOIRES pour que security_page fonctionne
# ========================================================================

# ========================================================================
# ÉTAPE 1: AJOUTEZ external_components (si pas déjà présent)
# ========================================================================
# À placer au début du fichier, après "esphome:" et "wifi:"

external_components:
  - source:
      type: local
      path: components  # Chemin vers le dossier components de ce repo
    components: [network_camera, multi_camera_display]

# ========================================================================
# ÉTAPE 2: AJOUTEZ LA VARIABLE GLOBALE
# ========================================================================
# À placer avant la section "lvgl:"

globals:
  - id: cam1_state
    type: bool
    initial_value: 'false'

# ========================================================================
# ÉTAPE 3: AJOUTEZ LA CAMÉRA RÉSEAU
# ========================================================================
# Créez cette section "network_camera:" (ou ajoutez à l'existante)

network_camera:
  - id: security_cam_1
    url: "rtsp://Tapoone:Tapoone132@192.168.1.56:554/stream1"
    protocol: rtsp
    width: 320
    height: 240
    canvas_id: security_canvas
    update_interval: 100ms

# ========================================================================
# ÉTAPE 4: AJOUTEZ LE MULTI-CAMERA DISPLAY (C'EST CELUI QUI MANQUE!)
# ========================================================================
# Créez cette section "multi_camera_display:"

multi_camera_display:
  id: security_display  # ← C'est cet ID qui manque dans votre config!
  canvas_id: security_canvas
  cameras:
    - camera_id: security_cam_1

# ========================================================================
# ÉTAPE 5: LA PAGE LVGL (que vous avez déjà)
# ========================================================================
# Dans la section lvgl: -> pages:

lvgl:
  # ... votre config LVGL existante ...

  pages:
    # ... vos autres pages ...

    - id: security_page
      bg_color: 0x1a1a1a
      on_load:
        - lambda: |-
            ESP_LOGI("security", "Security page loaded");
            static bool canvas_configured = false;
            if (!canvas_configured) {
              auto canvas = id(security_canvas);
              if (canvas != nullptr) {
                id(security_display).configure_canvas(canvas);  # ← security_display doit exister!
                canvas_configured = true;
                ESP_LOGI("security", "Security canvas configured");
              }
            }
      widgets:
        # ... vos widgets ...

# ========================================================================
# STRUCTURE COMPLÈTE DE P4MINI.YAML (ORDRE DES SECTIONS)
# ========================================================================
#
# esphome:
#   name: p4mini
#   ...
#
# wifi:
#   ...
#
# external_components:  ← AJOUTEZ ICI
#   - source:
#       type: local
#       path: components
#     components: [network_camera, multi_camera_display]
#
# globals:  ← AJOUTEZ ICI
#   - id: cam1_state
#     type: bool
#     initial_value: 'false'
#
# network_camera:  ← AJOUTEZ ICI
#   - id: security_cam_1
#     ...
#
# multi_camera_display:  ← AJOUTEZ ICI (C'EST CELUI QUI MANQUE!)
#   id: security_display
#   ...
#
# lvgl:
#   ...
#   pages:
#     - id: security_page  ← AJOUTEZ ICI
#       ...
#
# ========================================================================

# ========================================================================
# VÉRIFICATION DES IDs REQUIS
# ========================================================================
#
# Pour que security_page fonctionne, ces IDs doivent exister:
#
# ✓ security_cam_1      (network_camera)
# ✓ security_display    (multi_camera_display) ← CELUI QUI MANQUE!
# ✓ security_canvas     (canvas dans la page LVGL)
# ✓ cam1_state          (variable globale)
#
# ========================================================================

# ========================================================================
# DIAGNOSTIC DE L'ERREUR
# ========================================================================
#
# Erreur: "Couldn't find ID 'security_display'"
#
# Cause: La section "multi_camera_display:" n'a pas été ajoutée
#
# Solution: Ajoutez la section multi_camera_display avec id: security_display
#
# ========================================================================

# ============================================================================
# TEST CONFIGURATION - LVGL v9.4.0 (PR #12312)
# ============================================================================
# Cette configuration utilise la branche de développement LVGL v9.4.0
# de clydebarrow pour tester les nouvelles fonctionnalités.
#
# ATTENTION: C'est une branche en développement (DRAFT), des bugs sont possibles!
#
# IMPORTANT: ThorVG/SVG/Lottie ne sont PAS activés dans cette PR.
# C'est une migration de base de LVGL v8 vers v9.4.0.
# ============================================================================

# ============================================================================
# EXTERNAL COMPONENTS - LVGL v9.4.0 depuis la PR #12312
# ============================================================================
external_components:
  # LVGL v9.4.0 depuis le fork de clydebarrow
  - source:
      type: git
      url: https://github.com/clydebarrow/esphome
      ref: lvgl-9.4
    components:
      - lvgl
      - font
      - image
    refresh: 1d  # Rafraîchir tous les jours pour avoir les dernières corrections

  # Vos composants locaux existants (gardez-les!)
  - source:
      type: local
      path: components
    components:
      - sd_mmc_card
      - storage
      - mipi_dsi_cam
      - lvgl_camera_display
      # Ajoutez vos autres composants locaux ici

# ============================================================================
# STATUT DES FONCTIONNALITÉS LVGL v9.4.0 (PR #12312)
# ============================================================================
#
# ✅ DISPONIBLE:
#   - Migration LVGL v8 → v9.4.0
#   - Compatibilité avec configs existantes
#   - Amélioration mémoire RAM (-680 bytes)
#   - Nouveaux widgets et améliorations UI
#
# ❌ NON DISPONIBLE (pas activé dans la PR):
#   - ThorVG (moteur vectoriel)
#   - Support SVG natif
#   - Support Lottie animations
#   - GIF via LVGL (mais votre composant storage fonctionne!)
#
# ============================================================================

# ============================================================================
# NOTES IMPORTANTES POUR LVGL v9
# ============================================================================
#
# Changements majeurs dans LVGL v9 vs v8:
#
# 1. ThorVG est maintenant intégré - support SVG et Lottie potentiel
#    Pour activer dans lv_conf.h:
#    #define LV_USE_THORVG_INTERNAL 1
#    #define LV_USE_SVG 1
#
# 2. Certaines propriétés sont dépréciées mais toujours fonctionnelles
#
# 3. Nouveaux widgets disponibles:
#    - lv_lottie (animations Lottie)
#    - lv_svg (images SVG)
#
# 4. API de dessin vectoriel améliorée
#
# ============================================================================

# ============================================================================
# EXEMPLE DE CONFIGURATION LVGL v9 AVEC POTENTIEL SVG/LOTTIE
# ============================================================================
#
# Une fois LVGL v9 fonctionnel, vous pourriez utiliser:
#
# lvgl:
#   # Configuration de base (identique à v8)
#   displays:
#     - display_id: my_display
#
#   # Nouveautés v9 (à tester):
#   # - Support SVG natif via ThorVG
#   # - Support Lottie pour animations
#
# ============================================================================


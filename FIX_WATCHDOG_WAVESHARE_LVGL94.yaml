# Fix Watchdog Timeout pour waveshare.yaml avec LVGL 9.4
# Remplacer la section esp32 existante par celle-ci

esp32:
  variant: esp32p4
  flash_size: 32MB
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    version: 5.5.1
    # CRITICAL: Augmenter le watchdog timeout pour LVGL 9.4
    sdkconfig_options:
      # Watchdog timeout: 5 secondes → 300 secondes (5 minutes)
      # Si même après 5 minutes ça timeout, c'est un deadlock LVGL 9.4
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "300"

      # Ne pas surveiller les tâches IDLE (évite faux positifs pendant setup)
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: "n"
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU1: "n"

# IMPORTANT: Ne PAS désactiver complètement le watchdog avec:
# CONFIG_ESP_TASK_WDT_EN: "n"
# Car cela cause une erreur de compilation dans ota_backend_esp_idf.cpp:
# error: 'CONFIG_ESP_TASK_WDT_TIMEOUT_S' was not declared in this scope

# Problème actuel:
# [02:28:46][C][display.mipi_dsi:154]: MIPI DSI setup complete
# [02:29:16]E (34084) task_wdt: Task watchdog got triggered
# → 30 secondes de blocage après le display setup

# Cause:
# LVGL 9.4 se bloque complètement pendant son initialisation
# Ce n'est pas un timeout simple mais un DEADLOCK

# Test:
# Avec 300 secondes (5 minutes) de timeout:
# - Si ça passe : c'était juste très lent (peu probable)
# - Si timeout après 5 min : c'est un deadlock confirmé dans LVGL 9.4

# Si c'est un deadlock, solutions:
# 1. Revenir à LVGL 8.x temporairement
# 2. Désactiver ThorVG dans LVGL 9.4
# 3. Forcer LVGL à utiliser SRAM au lieu de PSRAM

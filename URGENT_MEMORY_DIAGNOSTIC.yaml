# ============================================================================
# 🔍 DIAGNOSTIC MÉMOIRE RUNTIME - Vérifier Allocation Modèles
# ============================================================================

esphome:
  on_boot:
    priority: 600  # Très tôt - avant init composants
    then:
      - lambda: |-
          ESP_LOGI("diagnostic", "╔════════════════════════════════════════════╗");
          ESP_LOGI("diagnostic", "║  AVANT CHARGEMENT MODÈLES                 ║");
          ESP_LOGI("diagnostic", "╚════════════════════════════════════════════╝");

          size_t ram_before = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t psram_before = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);

          ESP_LOGI("diagnostic", "RAM libre:   %.2f MB", ram_before / (1024.0 * 1024.0));
          ESP_LOGI("diagnostic", "PSRAM libre: %.2f MB", psram_before / (1024.0 * 1024.0));

  on_boot:
    priority: -200  # Très tard - après init composants
    then:
      - lambda: |-
          ESP_LOGI("diagnostic", "");
          ESP_LOGI("diagnostic", "╔════════════════════════════════════════════╗");
          ESP_LOGI("diagnostic", "║  APRÈS CHARGEMENT MODÈLES                  ║");
          ESP_LOGI("diagnostic", "╚════════════════════════════════════════════╝");

          size_t ram_after = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t psram_after = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          size_t ram_total = heap_caps_get_total_size(MALLOC_CAP_INTERNAL);
          size_t psram_total = heap_caps_get_total_size(MALLOC_CAP_SPIRAM);

          size_t ram_used = ram_total - ram_after;
          size_t psram_used = psram_total - psram_after;

          ESP_LOGI("diagnostic", "RAM:");
          ESP_LOGI("diagnostic", "  Utilisée: %.2f MB / %.2f MB (%.0f%%)",
                   ram_used / (1024.0 * 1024.0),
                   ram_total / (1024.0 * 1024.0),
                   (float)ram_used / ram_total * 100);

          if (psram_total > 0) {
            ESP_LOGI("diagnostic", "PSRAM:");
            ESP_LOGI("diagnostic", "  Utilisée: %.2f MB / %.2f MB (%.0f%%)",
                     psram_used / (1024.0 * 1024.0),
                     psram_total / (1024.0 * 1024.0),
                     (float)psram_used / psram_total * 100);

            // Déterminer où sont les modèles
            if (psram_used > ram_used * 1.5) {
              ESP_LOGI("diagnostic", "");
              ESP_LOGI("diagnostic", "✅ MODÈLES EN PSRAM");
              ESP_LOGI("diagnostic", "   %.2f MB en PSRAM vs %.2f MB en RAM",
                       psram_used / (1024.0 * 1024.0),
                       ram_used / (1024.0 * 1024.0));
            } else {
              ESP_LOGE("diagnostic", "");
              ESP_LOGE("diagnostic", "❌ MODÈLES EN RAM INTERNE !");
              ESP_LOGE("diagnostic", "   %.2f MB en RAM vs %.2f MB en PSRAM",
                       ram_used / (1024.0 * 1024.0),
                       psram_used / (1024.0 * 1024.0));
              ESP_LOGE("diagnostic", "");
              ESP_LOGE("diagnostic", "PROBLÈME: CONFIG_SPIRAM_RODATA ne fonctionne pas");
            }
          } else {
            ESP_LOGE("diagnostic", "");
            ESP_LOGE("diagnostic", "❌ PSRAM NON DÉTECTÉE !");
            ESP_LOGE("diagnostic", "   Total PSRAM: 0 MB");
          }

          ESP_LOGI("diagnostic", "");
          ESP_LOGI("diagnostic", "════════════════════════════════════════════");

logger:
  level: INFO
  logs:
    diagnostic: INFO
    MemoryManagerGreedy: DEBUG  # Activer logs ESP-DL
    dl::Model: DEBUG

# ============================================================================

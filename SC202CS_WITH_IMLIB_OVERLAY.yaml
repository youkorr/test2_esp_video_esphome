# ============================================================================
# Configuration SC202CS 1280x720 avec imlib Overlay Activé
# ============================================================================
# Ce fichier active imlib pour dessiner FPS, timestamp, et overlays
# directement sur les frames vidéo en temps réel (zero-copy)
# ============================================================================

esphome:
  name: m5tab5-sc202cs-imlib
  friendly_name: "M5Stack Tab5 SC202CS avec imlib"

  platformio_options:
    build_flags:
      - -DENABLE_IMLIB_DRAWING  # ← ACTIVE imlib drawing functions

esp32:
  board: esp32-p4-function-ev-board
  variant: esp32p4
  framework:
    type: esp-idf
    version: 5.3.1
    platform_version: https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip

# ============================================================================
# IMPORTANT: Charger imlib AVANT esp_cam_sensor
# ============================================================================
external_components:
  - source: components
    components:
      - imlib              # ← Charger en PREMIER
      - esp_cam_sensor     # ← Puis esp_cam_sensor
      - lvgl_camera_display

# ============================================================================
# imlib Component (Active automatiquement ENABLE_IMLIB_DRAWING)
# ============================================================================
imlib:

# ============================================================================
# Configuration I2C pour SC202CS
# ============================================================================
i2c:
  - id: bsp_bus
    scl: GPIO8
    sda: GPIO7
    frequency: 400kHz

# ============================================================================
# Caméra SC202CS 1280x720 @ 30 FPS (Fix HTS/VTS appliqué)
# ============================================================================
mipi_dsi_cam:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: sc202cs
  sensor_addr: 0x36
  resolution: "720P"        # 1280x720 avec fix HTS/VTS
  pixel_format: RGB565
  framerate: 30

  # PPA désactivé pour 720P (résolution = taille écran)
  # output_width: 1280
  # output_height: 720

# ============================================================================
# Display LVGL (M5Stack Tab5: 1280x720, rotation 270°)
# ============================================================================
lvgl:
  displays:
    - display_id: main_display

  buffer_size: 100%    # Buffer plein écran pour performance
  full_refresh: true

  pages:
    - id: camera_page
      bg_color: 0x000000

      widgets:
        # Canvas 1280x720 plein écran
        - canvas:
            id: camera_canvas
            width: 1280
            height: 720
            x: 0
            y: 0
            bg_color: 0x000000

        # Bouton RETOUR
        - button:
            id: btn_back
            width: 80
            height: 50
            x: 10
            y: 10
            bg_color: 0x333333
            radius: 8
            on_click:
              - lambda: |-
                  id(tab5_cam).stop_streaming();
              - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_align: CENTER

lvgl_camera_display:
  id: camera_display
  camera_id: tab5_cam
  canvas_id: camera_canvas
  update_interval: 33ms   # 30 FPS

# ============================================================================
# OVERLAY IMLIB: FPS Counter en Temps Réel
# ============================================================================
interval:
  - interval: 100ms  # Mise à jour 10 fois/seconde
    then:
      - lambda: |-
          // ========================================
          // FPS Counter avec imlib overlay
          // ========================================
          static uint32_t frame_count = 0;
          static uint32_t last_fps_time = millis();
          static float current_fps = 0.0;

          frame_count++;

          uint32_t now = millis();
          if (now - last_fps_time >= 1000) {
            // Calculer FPS
            current_fps = frame_count * 1000.0 / (now - last_fps_time);
            frame_count = 0;
            last_fps_time = now;
          }

          // Dessiner FPS en haut à gauche (texte blanc sur fond noir)
          char fps_text[32];
          snprintf(fps_text, sizeof(fps_text), "FPS: %.1f", current_fps);

          // Fond noir semi-transparent
          id(tab5_cam).draw_rectangle(5, 5, 180, 35, 0x0000, 1, true);

          // Texte blanc, taille 1.5x (24x24 pixels)
          id(tab5_cam).draw_string(10, 10, fps_text, 0xFFFF, 1.5);


# ============================================================================
# NOTES D'UTILISATION
# ============================================================================
#
# Couleurs RGB565:
#   0xFFFF - Blanc
#   0x0000 - Noir
#   0xF800 - Rouge
#   0x07E0 - Vert
#   0x001F - Bleu
#   0xFFE0 - Jaune
#   0xF81F - Magenta
#   0x07FF - Cyan
#
# Fonctions imlib disponibles:
#   draw_string(x, y, text, color, scale)
#   draw_line(x0, y0, x1, y1, color, thickness)
#   draw_rectangle(x, y, w, h, color, thickness, fill)
#   draw_circle(cx, cy, radius, color, thickness, fill)
#   get_pixel(x, y)
#   set_pixel(x, y, color)
#
# Performance:
#   - Zero-copy: dessine directement sur buffer V4L2
#   - Overhead: <1ms pour texte/formes simples
#   - Impact FPS: Négligeable (<3%)
#
# ============================================================================

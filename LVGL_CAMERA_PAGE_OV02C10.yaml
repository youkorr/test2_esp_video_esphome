# Page LVGL simplifiée pour caméra OV02C10
# Résolution: 800x480 (plein écran)
# Contrôles: BACK, START, STOP, INFO

lvgl:
  pages:
    - id: camera_page
      bg_color: 0x000000  # Fond noir

      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Page caméra OV02C10 chargée");
            ESP_LOGI("camera", "Canvas: 800x480 plein écran");

            // Optionnel: démarrer automatiquement le streaming
            // Décommentez les lignes ci-dessous pour auto-start:
            // if (id(tab5_cam).start_streaming()) {
            //   lv_label_set_text(id(camera_status_label), "LIVE");
            //   lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0x00FF00), 0);
            // }

      widgets:
        # ============================================
        # CANVAS CAMÉRA - PLEIN ÉCRAN
        # ============================================
        - canvas:
            id: camera_canvas
            width: 800
            height: 480
            x: 0
            y: 0
            bg_color: 0x000000

        # ============================================
        # BOUTONS DE CONTRÔLE - EN HAUT À DROITE
        # ============================================

        # Bouton RETOUR
        - button:
            id: btn_camera_back
            width: 100
            height: 45
            x: 680
            y: 10
            bg_color: 0x333333
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Arrêt du streaming et retour");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_20
                  text_align: CENTER

        # Bouton START
        - button:
            id: btn_start_streaming
            width: 100
            height: 45
            x: 680
            y: 65
            bg_color: 0x00AA00  # Vert
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  Démarrage du streaming");
                    if (id(tab5_cam).start_streaming()) {
                      lv_label_set_text(id(camera_status_label), "LIVE");
                      lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0x00FF00), 0);
                    } else {
                      lv_label_set_text(id(camera_status_label), "ERROR");
                      lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0xFF0000), 0);
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_20
                  text_align: CENTER

        # Bouton STOP
        - button:
            id: btn_stop_streaming
            width: 100
            height: 45
            x: 680
            y: 120
            bg_color: 0xCC0000  # Rouge
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "⏹️  Arrêt du streaming");
                    id(tab5_cam).stop_streaming();
                    lv_label_set_text(id(camera_status_label), "STOPPED");
                    lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0xFF8800), 0);
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_20
                  text_align: CENTER

        # Bouton INFO
        - button:
            id: btn_camera_info
            width: 100
            height: 45
            x: 680
            y: 175
            bg_color: 0x4682B4  # Bleu
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "📊 === INFORMATIONS CAMÉRA ===");
                    ESP_LOGI("camera", "Sensor: OV02C10");
                    ESP_LOGI("camera", "Résolution configurée: 800x480");

                    // Résolution runtime (seulement si streaming actif)
                    int w = id(tab5_cam).get_image_width();
                    int h = id(tab5_cam).get_image_height();
                    if (w > 0 && h > 0) {
                      ESP_LOGI("camera", "Résolution runtime: %dx%d", w, h);
                      ESP_LOGI("camera", "Streaming: ACTIF");
                    } else {
                      ESP_LOGI("camera", "Streaming: ARRÊTÉ");
                    }

                    ESP_LOGI("camera", "Format: RGB565");
                    ESP_LOGI("camera", "Canvas: 800x480 plein écran");
                    ESP_LOGI("camera", "Bayer: BGGR");
                    ESP_LOGI("camera", "MIPI: 2-lane");
                    ESP_LOGI("camera", "Adresse I2C: 0x36");

                    lv_label_set_text(id(camera_status_label), "INFO");
                    lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0x4682B4), 0);
                - delay: 2s
                - lambda: |-
                    if (id(tab5_cam).is_streaming()) {
                      lv_label_set_text(id(camera_status_label), "LIVE");
                      lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0x00FF00), 0);
                    } else {
                      lv_label_set_text(id(camera_status_label), "READY");
                      lv_obj_set_style_text_color(id(camera_status_label), lv_color_hex(0xFF8800), 0);
                    }
            widgets:
              - label:
                  text: "INFO"
                  text_color: 0xFFFFFF
                  text_font: nunito_20
                  text_align: CENTER

        # Bouton YOLO11 Toggle
        - button:
            id: btn_yolo11_toggle
            width: 100
            height: 45
            x: 680
            y: 230
            bg_color: 0xFF6600  # Orange (ON par défaut)
            radius: 8
            on_click:
              then:
                - lambda: |-
                    // Toggle YOLO11 detection drawing
                    static bool yolo11_enabled = true;
                    yolo11_enabled = !yolo11_enabled;

                    // Update YOLO11 component
                    id(yolo11_detector).set_draw_enabled(yolo11_enabled);

                    // Log status change
                    if (yolo11_enabled) {
                      ESP_LOGI("yolo11", "✅ YOLO11 detection boxes ENABLED");
                    } else {
                      ESP_LOGI("yolo11", "❌ YOLO11 detection boxes DISABLED");
                    }
            widgets:
              - label:
                  id: btn_yolo11_label
                  text: "YOLO"
                  text_color: 0xFFFFFF
                  text_font: nunito_20
                  text_align: CENTER

        # ============================================
        # LABEL DE STATUS - EN BAS À DROITE
        # ============================================
        - label:
            id: camera_status_label
            text: "READY"
            x: 730
            y: 450
            text_color: 0xFF8800
            text_font: nunito_24
            text_align: CENTER


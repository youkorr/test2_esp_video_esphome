# ========================================================================
# SECURITY PAGE - VERSION FINALE QUI FONCTIONNE
# ========================================================================
# Toutes les erreurs corrigées :
# ✅ stream2 au lieu de stream1 (profil H264 compatible)
# ✅ Canvas configuré dans le bouton START (évite size 0x0)
# ✅ Variables globales pour le state tracking
# ========================================================================

      - id: security_page
        bg_color: 0x1a1a1a
        on_load:
          - lambda: |-
              ESP_LOGI("security", "Security page loaded");
              // On ne configure PAS le canvas ici - on le fera dans le bouton START
        widgets:

          # ==============================================================
          # CANVAS
          # ==============================================================
          - canvas:
              id: security_canvas
              width: 640
              height: 480
              x: 10
              y: 10
              bg_color: 0x000000

          # ==============================================================
          # TITRE
          # ==============================================================
          - label:
              id: security_title
              text: "SECURITY"
              x: 660
              y: 10
              text_color: 0xFFFFFF
              text_font: nunito_24
              text_align: LEFT

          # ==============================================================
          # BOUTON RETOUR
          # ==============================================================
          - button:
              id: security_back
              width: 100
              height: 40
              x: 690
              y: 60
              bg_color: 0xe74c3c
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Stopping all cameras");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;
                  - lvgl.page.show: page_home
              widgets:
                - label:
                    text: "BACK"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON START ALL (avec configuration du canvas)
          # ==============================================================
          - button:
              id: btn_start_all
              width: 100
              height: 40
              x: 690
              y: 120
              bg_color: 0x27ae60
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0x27ae60
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      // Configurer le canvas la première fois
                      static bool canvas_configured = false;
                      if (!canvas_configured) {
                        auto canvas = id(security_canvas);
                        if (canvas != nullptr) {
                          lv_coord_t w = lv_obj_get_width(canvas);
                          lv_coord_t h = lv_obj_get_height(canvas);
                          ESP_LOGI("security", "Canvas size: %dx%d", w, h);

                          if (w > 0 && h > 0) {
                            id(security_display).configure_canvas(canvas);
                            canvas_configured = true;
                            ESP_LOGI("security", "Canvas configured successfully");
                          } else {
                            ESP_LOGE("security", "Canvas has invalid size!");
                          }
                        }
                      }

                      // Démarrer la caméra
                      ESP_LOGI("security", "Starting camera");
                      id(security_cam_1).set_enabled(true);
                      id(cam1_state) = true;
              widgets:
                - label:
                    text: "START"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON STOP ALL
          # ==============================================================
          - button:
              id: btn_stop_all
              width: 100
              height: 40
              x: 690
              y: 180
              bg_color: 0xe74c3c
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Stopping all cameras");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;
              widgets:
                - label:
                    text: "STOP"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON TOGGLE CAM 1
          # ==============================================================
          - button:
              id: btn_cam1_toggle
              width: 80
              height: 30
              x: 690
              y: 240
              bg_color: 0x3498db
              bg_opa: COVER
              radius: 15
              on_click:
                then:
                  - lambda: |-
                      id(cam1_state) = !id(cam1_state);
                      id(security_cam_1).set_enabled(id(cam1_state));
                      ESP_LOGI("security", "Camera 1: %s", id(cam1_state) ? "ON" : "OFF");
              widgets:
                - label:
                    text: "CAM 1"
                    text_color: 0xFFFFFF
                    text_font: nunito_20
                    text_align: CENTER
                    align: CENTER

# ========================================================================
# CONFIGURATION COMPLÈTE REQUISE DANS P4MINI.YAML
# ========================================================================

# 1. VARIABLE GLOBALE (avant lvgl:)
globals:
  - id: cam1_state
    type: bool
    initial_value: 'false'

# 2. NETWORK CAMERA (avec stream2!)
network_camera:
  - id: security_cam_1
    url: "rtsp://Tapoone:Tapoone132@192.168.1.56:554/stream2"  # ← stream2 !
    protocol: rtsp
    width: 320
    height: 240
    canvas_id: security_canvas
    update_interval: 100ms

# 3. MULTI CAMERA DISPLAY
multi_camera_display:
  id: security_display
  canvas_id: security_canvas
  cameras:
    - camera_id: security_cam_1

# 4. EXTERNAL COMPONENTS (en haut du fichier)
external_components:
  - source:
      type: local
      path: components
    components: [network_camera, multi_camera_display]

# ========================================================================
# CHANGEMENTS PAR RAPPORT À LA VERSION PRÉCÉDENTE
# ========================================================================
#
# ✅ on_load: Retiré la configuration du canvas (problème de timing)
# ✅ btn_start_all: Ajouté la configuration du canvas + vérification taille
# ✅ URL: stream2 au lieu de stream1 (profil H264 compatible)
# ✅ Canvas: Vérification w > 0 && h > 0 avant configure_canvas()
#
# ========================================================================

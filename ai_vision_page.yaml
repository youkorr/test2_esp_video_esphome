# =============================================================================
# AI Vision Page (ESP32-P4-Eye port)
# -----------------------------------------------------------------------------
# A single LVGL page that mirrors the four flagship demos of the official
# esp32_p4_eye factory_demo:
#   - Face detection / recognition  (face_detection component)
#   - COCO object detection         (yolo11_detection component)
#   - Pedestrian detection          (pedestrian_detection component)
#   - Painter / freehand drawing    (esp_painter equivalent, native LVGL canvas)
#
# The page uses ONE shared LVGL canvas. The active detector is selected with
# a tab bar at the top; switching tabs reroutes lvgl_camera_display to the
# matching detector and updates the on-canvas overlay.
#
# How to use
# ----------
# 1. Required globals (paste once at the top level of your YAML):
#
#      globals:
#        - id: ai_vision_mode
#          type: int
#          initial_value: '0'
#        - id: ai_vision_painter_active
#          type: bool
#          initial_value: 'false'
#        - id: ai_vision_paint_color
#          type: uint32_t
#          initial_value: '0xffffff'
#
# 2. Make sure these components are configured at the TOP LEVEL of your YAML
#    (this file does NOT instantiate them, it only adds the LVGL page):
#
#      lvgl_camera_display:
#        id: camera_display
#        camera_id: tab5_cam
#        canvas_id: ai_vision_canvas
#        update_interval: 33ms
#        face_detection_id: face_detect
#        yolo11_detection_id: yolo_detect
#        pedestrian_detection_id: pedestrian_detect
#
#      face_detection:
#        id: face_detect
#        camera_id: tab5_cam
#        canvas_id: ai_vision_canvas
#        ...
#
#      yolo11_detection:
#        id: yolo_detect
#        camera_id: tab5_cam
#        canvas_id: ai_vision_canvas
#        model_variant: s8_v1
#        score_threshold: 0.35
#        nms_threshold: 0.5
#        detection_interval: 8
#
#      pedestrian_detection:
#        id: pedestrian_detect
#        camera_id: tab5_cam
#        canvas_id: ai_vision_canvas
#        score_threshold: 0.5
#        detection_interval: 4
#
# 3. Drop the page below into your `lvgl: pages:` list:
#
#      lvgl:
#        pages:
#          - !include ai_vision_page.yaml
#
# 4. Add a button somewhere to navigate to it:
#
#      - lvgl.page.show: ai_vision_page
# =============================================================================

id: ai_vision_page
bg_color: 0x0d1117

on_load:
  - lambda: |-
      ESP_LOGI("ai_vision", "AI Vision page loaded");
      id(ai_vision_mode) = 0;
      id(tab5_cam).start_streaming();
      auto canvas = id(ai_vision_canvas);
      if (canvas != nullptr) {
        id(camera_display).configure_canvas(canvas);
      }
      id(face_detect).set_draw_enabled(true);

on_unload:
  - lambda: |-
      ESP_LOGI("ai_vision", "AI Vision page unloaded");

widgets:
  # -------------------- Tab bar --------------------
  - obj:
      x: 0
      y: 0
      width: 1024
      height: 56
      bg_color: 0x161b22
      border_opa: TRANSP
      pad_all: 4
      layout:
        type: FLEX
        flex_flow: ROW
        flex_align_main: SPACE_EVENLY
        flex_align_cross: CENTER
      widgets:
        - button:
            id: ai_tab_face
            width: 220
            height: 44
            bg_color: 0x1f6feb
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 0;
                    id(face_detect).set_draw_enabled(true);
                    id(yolo_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_paused(false);
                    lv_label_set_text(id(ai_vision_status), "Mode: Face detection");
            widgets:
              - label: { align: CENTER, text: "Face", text_color: 0xffffff, text_font: roboto_18 }
        - button:
            id: ai_tab_coco
            width: 220
            height: 44
            bg_color: 0x238636
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 1;
                    id(face_detect).set_draw_enabled(false);
                    id(yolo_detect).set_draw_enabled(true);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_paused(false);
                    lv_label_set_text(id(ai_vision_status), "Mode: COCO objects");
            widgets:
              - label: { align: CENTER, text: "COCO", text_color: 0xffffff, text_font: roboto_18 }
        - button:
            id: ai_tab_ped
            width: 220
            height: 44
            bg_color: 0xa371f7
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 2;
                    id(face_detect).set_draw_enabled(false);
                    id(yolo_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_draw_enabled(true);
                    id(ai_vision_painter_active) = false;
                    id(camera_display).set_paused(false);
                    lv_label_set_text(id(ai_vision_status), "Mode: Pedestrian");
            widgets:
              - label: { align: CENTER, text: "Pedestrian", text_color: 0xffffff, text_font: roboto_18 }
        - button:
            id: ai_tab_paint
            width: 220
            height: 44
            bg_color: 0xdb6d28
            on_click:
              then:
                - lambda: |-
                    id(ai_vision_mode) = 3;
                    id(face_detect).set_draw_enabled(false);
                    id(yolo_detect).set_draw_enabled(false);
                    id(pedestrian_detect).set_draw_enabled(false);
                    id(ai_vision_painter_active) = true;
                    id(camera_display).set_paused(true);
                    auto cv = id(ai_vision_canvas);
                    if (cv != nullptr) {
                      lv_canvas_fill_bg(cv, lv_color_hex(0x000000), LV_OPA_COVER);
                    }
                    lv_label_set_text(id(ai_vision_status), "Mode: Painter (drag to draw)");
            widgets:
              - label: { align: CENTER, text: "Paint", text_color: 0xffffff, text_font: roboto_18 }

  # -------------------- Shared canvas --------------------
  - canvas:
      id: ai_vision_canvas
      x: 192
      y: 70
      width: 640
      height: 480
      bg_color: 0x000000
      radius: 8
      on_pressing:
        then:
          - lambda: |-
              if (!id(ai_vision_painter_active)) return;
              auto canvas = id(ai_vision_canvas);
              if (canvas == nullptr) return;
              lv_indev_t * indev = lv_indev_get_act();
              if (indev == nullptr) return;
              lv_point_t p;
              lv_indev_get_point(indev, &p);
              lv_area_t a;
              lv_obj_get_coords(canvas, &a);
              int32_t lx = p.x - a.x1;
              int32_t ly = p.y - a.y1;
              if (lx < 0 || ly < 0 || lx >= 640 || ly >= 480) return;
              lv_color_t col = lv_color_hex(id(ai_vision_paint_color));
              for (int dy = -3; dy <= 3; dy++) {
                for (int dx = -3; dx <= 3; dx++) {
                  int32_t xx = lx + dx;
                  int32_t yy = ly + dy;
                  if (xx >= 0 && yy >= 0 && xx < 640 && yy < 480) {
                    lv_canvas_set_px(canvas, xx, yy, col);
                  }
                }
              }

  # -------------------- Status label --------------------
  - label:
      id: ai_vision_status
      x: 192
      y: 556
      width: 640
      text: "Mode: Face detection"
      text_align: CENTER
      text_color: 0x58a6ff
      text_font: roboto_18

  # -------------------- Right side panel --------------------
  - obj:
      x: 840
      y: 70
      width: 174
      height: 480
      bg_color: 0x161b22
      border_color: 0x30363d
      border_width: 1
      radius: 8
      pad_all: 8
      layout:
        type: FLEX
        flex_flow: COLUMN
        flex_align_cross: CENTER
        pad_row: 8
      widgets:
        - label: { text: "Detected", text_color: 0x8b949e, text_font: roboto_18 }
        - label: { id: ai_vision_count, text: "0", text_color: 0xffffff, text_font: roboto_48 }
        - label: { text: "Painter color", text_color: 0x8b949e, text_font: roboto_18 }
        - obj:
            width: 150
            height: 44
            bg_opa: TRANSP
            border_opa: TRANSP
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              - button:
                  width: 32
                  height: 32
                  bg_color: 0xff4040
                  on_click:
                    then: { lambda: 'id(ai_vision_paint_color) = 0xff4040;' }
              - button:
                  width: 32
                  height: 32
                  bg_color: 0x40d040
                  on_click:
                    then: { lambda: 'id(ai_vision_paint_color) = 0x40d040;' }
              - button:
                  width: 32
                  height: 32
                  bg_color: 0x4080ff
                  on_click:
                    then: { lambda: 'id(ai_vision_paint_color) = 0x4080ff;' }
              - button:
                  width: 32
                  height: 32
                  bg_color: 0xffffff
                  on_click:
                    then: { lambda: 'id(ai_vision_paint_color) = 0xffffff;' }
        - button:
            width: 150
            height: 40
            bg_color: 0x30363d
            on_click:
              then:
                - lambda: |-
                    auto cv = id(ai_vision_canvas);
                    if (cv != nullptr) {
                      lv_canvas_fill_bg(cv, lv_color_hex(0x000000), LV_OPA_COVER);
                    }
            widgets:
              - label: { align: CENTER, text: "Clear canvas", text_color: 0xffffff, text_font: roboto_18 }
        - button:
            width: 150
            height: 40
            bg_color: 0x1f6feb
            on_click:
              then:
                - lambda: |-
                    id(camera_display).set_paused(false);
                    id(ai_vision_painter_active) = false;
            widgets:
              - label: { align: CENTER, text: "Resume cam", text_color: 0xffffff, text_font: roboto_18 }
        - button:
            width: 150
            height: 44
            bg_color: 0x6e7681
            on_click:
              then:
                - lvgl.page.show: home_page    # <- replace with your home page id
            widgets:
              - label: { align: CENTER, text: "Back", text_color: 0xffffff, text_font: roboto_18 }

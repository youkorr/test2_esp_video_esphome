# ============================================================================
# FACE UNLOCK PAGE - Déverrouillage par reconnaissance faciale + Code PIN
# ============================================================================
# À inclure dans votre configuration principale ESPHome
#
# Prérequis:
#   - Ajouter dans substitutions: unlock_pin_code: "0000"
#   - Ajouter les globals ci-dessous
#   - Modifier votre on_idle existant
# ============================================================================

# ============================================================================
# SUBSTITUTIONS (à ajouter dans votre fichier principal)
# ============================================================================
# substitutions:
#   pin_code: "1234"           # Code alarme (existant)
#   unlock_pin_code: "0000"    # Code déverrouillage écran (NOUVEAU)

# ============================================================================
# GLOBALS (à ajouter dans votre fichier principal)
# ============================================================================
globals:
  - id: display_lock
    type: bool
    initial_value: 'false'
  - id: unlock_timeout_start
    type: uint32_t
    initial_value: '0'
  - id: face_unlock_timeout_sec
    type: int
    initial_value: '15'

# ============================================================================
# PAGES LVGL
# ============================================================================
lvgl:
  pages:
    # ========================================================================
    # PAGE DE VEILLE (écran noir avec détection tactile)
    # ========================================================================
    - id: page_sleep
      bg_color: 0x000000

      on_load:
        - lambda: |-
            ESP_LOGI("lock", "🔒 Page veille - écran verrouillé");
            id(display_lock) = true;

      widgets:
        # Fond noir
        - obj:
            width: 1024
            height: 600
            x: 0
            y: 0
            bg_color: 0x000000
            bg_opa: COVER
            border_opa: TRANSP

        # Horloge centrée (optionnel - visible avant extinction backlight)
        - label:
            id: sleep_time_label
            text: "12:34"
            align: CENTER
            y: -50
            text_color: 0x333333
            text_font: roboto_48

        # Message "Touchez pour déverrouiller"
        - label:
            text: "Touchez l'écran pour déverrouiller"
            align: CENTER
            y: 50
            text_color: 0x222222
            text_font: roboto_24

        # Zone tactile invisible plein écran
        - obj:
            id: sleep_touch_zone
            width: 1024
            height: 600
            x: 0
            y: 0
            bg_opa: 0%
            border_opa: TRANSP
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("lock", "👆 Touch détecté - affichage page déverrouillage");
                - light.turn_on: backlight
                - lvgl.page.show: face_unlock_page

    # ========================================================================
    # PAGE DE DÉVERROUILLAGE (Face Recognition + Code PIN)
    # ========================================================================
    - id: face_unlock_page
      bg_color: 0x0d1117

      on_load:
        - lambda: |-
            ESP_LOGI("lock", "🔓 Page déverrouillage chargée");
            // Démarrer la caméra
            id(tab5_cam).start_streaming();
            // Configurer le canvas
            auto canvas = id(face_unlock_canvas);
            if (canvas != nullptr) {
              id(camera_display).configure_canvas(canvas);
              ESP_LOGI("lock", "Canvas configuré pour reconnaissance faciale");
            }
            // Reset timeout
            id(unlock_timeout_start) = millis();
            // Reset affichage code
            lv_label_set_text(id(unlock_code_display), "○ ○ ○ ○");
            lv_obj_set_style_text_color(id(unlock_code_display), lv_color_hex(0xFFFFFF), 0);
            // Reset status
            lv_label_set_text(id(face_status_label), "Regardez la caméra...");
            lv_obj_set_style_text_color(id(face_status_label), lv_color_hex(0x58a6ff), 0);

      widgets:
        # ===== HEADER =====
        - obj:
            x: 0
            y: 0
            width: 1024
            height: 50
            bg_color: 0x161b22
            bg_opa: COVER
            border_opa: TRANSP
            radius: 0
            widgets:
              # Icône cadenas
              - label:
                  text: "\U000F0341"
                  x: 20
                  y: 5
                  text_color: 0xf85149
                  text_font: mdi_icons_40

              # Titre
              - label:
                  text: "DÉVERROUILLAGE"
                  x: 70
                  y: 10
                  text_color: 0xFFFFFF
                  text_font: roboto_32

              # Heure
              - label:
                  id: unlock_time_label
                  text: "12:34"
                  x: 900
                  y: 12
                  text_color: 0x8b949e
                  text_font: roboto_24

        # ===== SECTION GAUCHE: CAMERA =====
        - obj:
            id: camera_section
            x: 10
            y: 55
            width: 660
            height: 535
            bg_color: 0x161b22
            bg_opa: COVER
            radius: 15
            border_width: 1
            border_color: 0x30363d
            widgets:
              # Header section caméra
              - obj:
                  x: 0
                  y: 0
                  width: 660
                  height: 45
                  bg_color: 0x21262d
                  bg_opa: COVER
                  radius: 15
                  border_opa: TRANSP
                  widgets:
                    - label:
                        text: "\U000F0644"
                        x: 15
                        y: 5
                        text_color: 0x58a6ff
                        text_font: mdi_icons_32
                    - label:
                        text: "Reconnaissance Faciale"
                        x: 55
                        y: 10
                        text_color: 0x58a6ff
                        text_font: roboto_24

              # Canvas caméra 640x480
              - canvas:
                  id: face_unlock_canvas
                  width: 640
                  height: 480
                  x: 10
                  y: 50
                  bg_color: 0x000000
                  radius: 8

              # Status reconnaissance
              - label:
                  id: face_status_label
                  text: "Regardez la caméra..."
                  x: 0
                  y: 505
                  width: 660
                  text_align: CENTER
                  text_color: 0x58a6ff
                  text_font: roboto_18

        # ===== SECTION DROITE: CLAVIER PIN =====
        - obj:
            id: keypad_section
            x: 680
            y: 55
            width: 334
            height: 535
            bg_color: 0x161b22
            bg_opa: COVER
            radius: 15
            border_width: 1
            border_color: 0x30363d
            widgets:
              # Header section PIN
              - obj:
                  x: 0
                  y: 0
                  width: 334
                  height: 45
                  bg_color: 0x21262d
                  bg_opa: COVER
                  radius: 15
                  border_opa: TRANSP
                  widgets:
                    - label:
                        text: "\U000F09A0"
                        x: 15
                        y: 5
                        text_color: 0x58a6ff
                        text_font: mdi_icons_32
                    - label:
                        text: "Code PIN"
                        x: 55
                        y: 10
                        text_color: 0x58a6ff
                        text_font: roboto_24

              # Affichage du code (points)
              - obj:
                  x: 17
                  y: 55
                  width: 300
                  height: 60
                  bg_color: 0x0d1117
                  radius: 10
                  border_width: 2
                  border_color: 0x30363d
                  widgets:
                    - label:
                        id: unlock_code_display
                        text: "○ ○ ○ ○"
                        align: CENTER
                        text_color: 0xFFFFFF
                        text_font: roboto_32

              # Clavier numérique
              - buttonmatrix:
                  id: unlock_keypad
                  x: 17
                  y: 125
                  width: 300
                  height: 400
                  pad_all: 5
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  items:
                    bg_color: 0x21262d
                    border_color: 0x30363d
                    border_width: 1
                    radius: 12
                    text_font: roboto_32
                    text_color: 0xFFFFFF
                    pressed:
                      bg_color: 0x58a6ff
                      text_color: 0x0d1117
                  rows:
                    - buttons:
                        - text: "1"
                          control:
                            no_repeat: true
                        - text: "2"
                          control:
                            no_repeat: true
                        - text: "3"
                          control:
                            no_repeat: true
                    - buttons:
                        - text: "4"
                          control:
                            no_repeat: true
                        - text: "5"
                          control:
                            no_repeat: true
                        - text: "6"
                          control:
                            no_repeat: true
                    - buttons:
                        - text: "7"
                          control:
                            no_repeat: true
                        - text: "8"
                          control:
                            no_repeat: true
                        - text: "9"
                          control:
                            no_repeat: true
                    - buttons:
                        - text: "\U000F0B5C"
                          key_code: "*"
                          control:
                            no_repeat: true
                        - text: "0"
                          control:
                            no_repeat: true
                        - text: "\U000F012C"
                          key_code: "#"
                          control:
                            no_repeat: true

        # ===== BARRE DE TIMEOUT EN BAS =====
        - obj:
            x: 10
            y: 595
            width: 1004
            height: 5
            bg_color: 0x21262d
            bg_opa: COVER
            radius: 3
            border_opa: TRANSP
            widgets:
              - bar:
                  id: unlock_timeout_bar
                  x: 0
                  y: 0
                  width: 1004
                  height: 5
                  value: 100
                  bg_color: 0x21262d
                  bg_opa: TRANSP
                  radius: 3
                  indicator:
                    bg_color: 0x3fb950
                    radius: 3

# ============================================================================
# KEY COLLECTOR POUR LE DÉVERROUILLAGE ÉCRAN
# ============================================================================
key_collector:
  - source_id: unlock_keypad
    min_length: 4
    max_length: 4
    end_keys: "#"
    end_key_required: true
    back_keys: "*"
    allowed_keys: "0123456789*#"
    timeout: 10s
    on_progress:
      - if:
          condition:
            lambda: return (0 != x.compare(std::string{""}));
          then:
            - lvgl.label.update:
                id: unlock_code_display
                text: !lambda |-
                  std::string display = "";
                  for (size_t i = 0; i < x.length(); i++) {
                    display += "● ";
                  }
                  for (size_t i = x.length(); i < 4; i++) {
                    display += "○ ";
                  }
                  return display.c_str();
          else:
            - lvgl.label.update:
                id: unlock_code_display
                text_color: 0xFFFFFF
                text: "○ ○ ○ ○"
    on_result:
      - if:
          condition:
            lambda: 'return x == "${unlock_pin_code}";'
          then:
            # Code correct - déverrouiller
            - lvgl.label.update:
                id: unlock_code_display
                text_color: 0x3fb950
                text: "✓ ✓ ✓ ✓"
            - lvgl.label.update:
                id: face_status_label
                text_color: 0x3fb950
                text: "Code correct - Bienvenue!"
            - lambda: |-
                ESP_LOGI("unlock", "🔓 Code PIN correct - déverrouillage!");
                id(display_lock) = false;
            - delay: 500ms
            - lambda: |-
                id(tab5_cam).stop_streaming();
                // Reconfigurer le canvas pour la page caméra normale
                auto canvas = id(camera_canvas);
                if (canvas != nullptr) {
                  id(camera_display).configure_canvas(canvas);
                }
            - lvgl.page.show: page_home
          else:
            # Code incorrect
            - lvgl.label.update:
                id: unlock_code_display
                text_color: 0xf85149
                text: "✗ ✗ ✗ ✗"
            - lvgl.label.update:
                id: face_status_label
                text_color: 0xf85149
                text: "Code incorrect!"
            - lambda: |-
                ESP_LOGW("unlock", "❌ Code PIN incorrect!");
            - delay: 1000ms
            - lvgl.label.update:
                id: unlock_code_display
                text_color: 0xFFFFFF
                text: "○ ○ ○ ○"
            - lvgl.label.update:
                id: face_status_label
                text_color: 0x58a6ff
                text: "Regardez la caméra..."

# ============================================================================
# INTERVAL POUR RECONNAISSANCE FACIALE ET TIMEOUT
# ============================================================================
interval:
  - interval: 200ms
    then:
      - lambda: |-
          // Seulement actif sur face_unlock_page
          lv_obj_t *current = lv_scr_act();
          if (current != id(face_unlock_page)) return;

          // === GESTION DU TIMEOUT ===
          uint32_t elapsed = (millis() - id(unlock_timeout_start)) / 1000;
          int remaining = id(face_unlock_timeout_sec) - elapsed;
          int percent = (remaining * 100) / id(face_unlock_timeout_sec);
          if (percent < 0) percent = 0;

          // Mettre à jour la barre de progression
          lv_bar_set_value(id(unlock_timeout_bar), percent, LV_ANIM_ON);

          // Changer couleur selon temps restant
          if (remaining <= 5) {
            lv_obj_set_style_bg_color(id(unlock_timeout_bar), lv_color_hex(0xf85149), LV_PART_INDICATOR);
          } else if (remaining <= 10) {
            lv_obj_set_style_bg_color(id(unlock_timeout_bar), lv_color_hex(0xd29922), LV_PART_INDICATOR);
          } else {
            lv_obj_set_style_bg_color(id(unlock_timeout_bar), lv_color_hex(0x3fb950), LV_PART_INDICATOR);
          }

          // === TIMEOUT EXPIRÉ ===
          if (remaining <= 0) {
            ESP_LOGI("lock", "⏱️ Timeout - retour veille");
            lv_label_set_text(id(face_status_label), "Timeout - Retour veille...");
            lv_obj_set_style_text_color(id(face_status_label), lv_color_hex(0xf85149), 0);
            id(tab5_cam).stop_streaming();
            // Reconfigurer canvas pour page caméra normale
            auto canvas = id(camera_canvas);
            if (canvas != nullptr) {
              id(camera_display).configure_canvas(canvas);
            }
          }

          // === VÉRIFIER RECONNAISSANCE FACIALE ===
          auto result = id(camera_display).get_last_recognition();
          if (result.recognized && result.similarity >= 0.70f) {
            ESP_LOGI("lock", "🔓 VISAGE RECONNU! ID=%d sim=%.2f", result.id, result.similarity);
            id(display_lock) = false;

            // Afficher message de bienvenue
            char msg[64];
            snprintf(msg, sizeof(msg), "✓ Bienvenue! (ID:%d)", result.id);
            lv_label_set_text(id(face_status_label), msg);
            lv_obj_set_style_text_color(id(face_status_label), lv_color_hex(0x3fb950), 0);

            // Afficher succès sur le code aussi
            lv_label_set_text(id(unlock_code_display), "✓ ✓ ✓ ✓");
            lv_obj_set_style_text_color(id(unlock_code_display), lv_color_hex(0x3fb950), 0);
          }

      # === TRANSITION APRÈS DÉVERROUILLAGE ===
      - if:
          condition:
            lambda: |-
              lv_obj_t *current = lv_scr_act();
              return (current == id(face_unlock_page)) && !id(display_lock);
          then:
            - delay: 800ms
            - lambda: |-
                id(tab5_cam).stop_streaming();
                // Reconfigurer canvas
                auto canvas = id(camera_canvas);
                if (canvas != nullptr) {
                  id(camera_display).configure_canvas(canvas);
                }
            - lvgl.page.show: page_home

      # === RETOUR VEILLE SI TIMEOUT ===
      - if:
          condition:
            lambda: |-
              lv_obj_t *current = lv_scr_act();
              if (current != id(face_unlock_page)) return false;
              uint32_t elapsed = (millis() - id(unlock_timeout_start)) / 1000;
              return elapsed >= (id(face_unlock_timeout_sec) + 1);  // +1 pour afficher message
          then:
            - light.turn_off: backlight
            - lvgl.page.show: page_sleep


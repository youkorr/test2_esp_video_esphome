# ============================================================================
# EXEMPLES PRATIQUES - Lottie & SVG UI avec LVGL V9
# ============================================================================
# Ce fichier contient des exemples concrets d'utilisation de Lottie et SVG
# pour créer une interface moderne et fluide sur ESP32-P4.
#
# PRÉREQUIS:
#   - LVGL V9.4 activé (voir lvgl_v9_thorvg_complete_config.yaml)
#   - lvgl_advanced_features configuré avec thorvg: true, svg: true, lottie: true
#   - Fichiers Lottie/SVG téléchargés sur carte SD
# ============================================================================

# ============================================================================
# EXEMPLE 1 - Page météo animée avec Lottie
# ============================================================================
# Interface météo moderne avec animations Lottie basmilius/weather-icons
# Téléchargez depuis: https://github.com/basmilius/weather-icons/tree/dev/production/lottie

# Dépend de votre configuration existante
# esphome:
#   name: esp32p4-weather
#
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# api:
#   encryption:
#     key: !secret api_key
#
# time:
#   - platform: homeassistant
#     id: ha_time

# Configuration LVGL pour page météo
lvgl:
  # ... (votre configuration display existante)

  pages:
    # ============================================================================
    # PAGE MÉTÉO PRINCIPALE
    # ============================================================================
    - id: weather_page
      bg_color: 0x1A1A2E  # Bleu nuit moderne

      widgets:
        # ========================================================================
        # ANIMATION MÉTÉO PRINCIPALE (Lottie)
        # ========================================================================
        # Animation du temps actuel - occupe le centre gauche
        - lottie:
            id: current_weather_animation
            src: "/sdcard/weather/clear-day.json"  # Fichier par défaut
            width: 250
            height: 250
            x: 50
            y: 80
            loop: true
            autoplay: true
            # Note: Le fichier sera changé dynamiquement selon la météo

        # ========================================================================
        # INFORMATIONS TEXTUELLES
        # ========================================================================
        # Température actuelle (grande police)
        - label:
            id: current_temp
            text: "24°C"
            x: 320
            y: 120
            text_font: montserrat_48
            text_color: 0xFFFFFF

        # Description météo
        - label:
            id: weather_description
            text: "Ensoleillé"
            x: 320
            y: 180
            text_font: montserrat_24
            text_color: 0xB8B8D0

        # Ressenti
        - label:
            id: feels_like
            text: "Ressenti: 22°C"
            x: 320
            y: 220
            text_font: montserrat_16
            text_color: 0x808090

        # ========================================================================
        # PRÉVISIONS (Icônes SVG)
        # ========================================================================
        # Prévision J+1
        - obj:
            id: forecast_day1
            x: 50
            y: 350
            width: 120
            height: 100
            bg_color: 0x252540
            radius: 10

            widgets:
              # Icône météo SVG (vectorielle, scale parfait)
              - image:
                  id: forecast_day1_icon
                  src: "/sdcard/icons/sun.svg"
                  width: 48
                  height: 48
                  x: 36  # Centré dans le container
                  y: 10

              # Jour de la semaine
              - label:
                  id: forecast_day1_label
                  text: "Lun"
                  x: 40
                  y: 65
                  text_font: montserrat_14
                  text_color: 0xFFFFFF

              # Température
              - label:
                  id: forecast_day1_temp
                  text: "26°"
                  x: 45
                  y: 80
                  text_font: montserrat_12
                  text_color: 0xB8B8D0

        # Prévision J+2 (même structure)
        - obj:
            id: forecast_day2
            x: 180
            y: 350
            width: 120
            height: 100
            bg_color: 0x252540
            radius: 10

            widgets:
              - image:
                  id: forecast_day2_icon
                  src: "/sdcard/icons/cloud.svg"
                  width: 48
                  height: 48
                  x: 36
                  y: 10

              - label:
                  id: forecast_day2_label
                  text: "Mar"
                  x: 40
                  y: 65
                  text_font: montserrat_14
                  text_color: 0xFFFFFF

              - label:
                  id: forecast_day2_temp
                  text: "24°"
                  x: 45
                  y: 80
                  text_font: montserrat_12
                  text_color: 0xB8B8D0

        # Prévision J+3
        - obj:
            id: forecast_day3
            x: 310
            y: 350
            width: 120
            height: 100
            bg_color: 0x252540
            radius: 10

            widgets:
              - image:
                  id: forecast_day3_icon
                  src: "/sdcard/icons/rain.svg"
                  width: 48
                  height: 48
                  x: 36
                  y: 10

              - label:
                  id: forecast_day3_label
                  text: "Mer"
                  x: 40
                  y: 65
                  text_font: montserrat_14
                  text_color: 0xFFFFFF

              - label:
                  id: forecast_day3_temp
                  text: "19°"
                  x: 45
                  y: 80
                  text_font: montserrat_12
                  text_color: 0xB8B8D0

        # ========================================================================
        # INFORMATIONS SUPPLÉMENTAIRES (Icônes SVG + texte)
        # ========================================================================
        # Humidité
        - obj:
            id: humidity_info
            x: 500
            y: 350
            width: 130
            height: 40
            bg_opa: 0  # Transparent

            widgets:
              - image:
                  src: "/sdcard/icons/humidity.svg"
                  width: 32
                  height: 32
                  x: 0
                  y: 4

              - label:
                  id: humidity_value
                  text: "65%"
                  x: 45
                  y: 0
                  text_font: montserrat_16
                  text_color: 0xFFFFFF

              - label:
                  text: "Humidité"
                  x: 45
                  y: 20
                  text_font: montserrat_12
                  text_color: 0x808090

        # Vent
        - obj:
            id: wind_info
            x: 650
            y: 350
            width: 130
            height: 40
            bg_opa: 0

            widgets:
              - image:
                  src: "/sdcard/icons/wind.svg"
                  width: 32
                  height: 32
                  x: 0
                  y: 4

              - label:
                  id: wind_value
                  text: "15 km/h"
                  x: 45
                  y: 0
                  text_font: montserrat_16
                  text_color: 0xFFFFFF

              - label:
                  text: "Vent"
                  x: 45
                  y: 20
                  text_font: montserrat_12
                  text_color: 0x808090

        # ========================================================================
        # QR CODE pour partage météo
        # ========================================================================
        - qrcode:
            id: weather_share_qr
            text: "https://weather.com/share/location"
            size: 80
            x: 700
            y: 400
            bg_color: 0xFFFFFF
            fg_color: 0x000000

# ============================================================================
# AUTOMATION - Mise à jour météo dynamique
# ============================================================================
# Change l'animation Lottie selon l'état météo de Home Assistant

# Sensor pour récupérer l'état météo depuis Home Assistant
sensor:
  - platform: homeassistant
    id: weather_state
    entity_id: weather.home
    on_value:
      then:
        - lambda: |-
            std::string state = id(weather_state).state;
            std::string animation_path = "/sdcard/weather/";
            std::string icon_path = "/sdcard/icons/";

            // Mapper état météo → fichier Lottie
            if (state == "sunny" || state == "clear") {
              // Jour ou nuit?
              auto time = id(ha_time).now();
              if (time.hour >= 6 && time.hour < 20) {
                animation_path += "clear-day.json";
                icon_path += "sun.svg";
              } else {
                animation_path += "clear-night.json";
                icon_path += "moon.svg";
              }
            } else if (state == "partlycloudy") {
              animation_path += "partly-cloudy-day.json";
              icon_path += "cloud-sun.svg";
            } else if (state == "cloudy") {
              animation_path += "cloudy.json";
              icon_path += "cloud.svg";
            } else if (state == "rainy") {
              animation_path += "rain.json";
              icon_path += "rain.svg";
            } else if (state == "pouring") {
              animation_path += "extreme-rain.json";
              icon_path += "rain-heavy.svg";
            } else if (state == "snowy") {
              animation_path += "snow.json";
              icon_path += "snow.svg";
            } else if (state == "lightning" || state == "lightning-rainy") {
              animation_path += "thunderstorms.json";
              icon_path += "lightning.svg";
            } else if (state == "fog") {
              animation_path += "fog.json";
              icon_path += "fog.svg";
            } else if (state == "windy") {
              animation_path += "wind.json";
              icon_path += "wind.svg";
            }

            ESP_LOGI("weather", "Changing animation to: %s", animation_path.c_str());

            // Charger la nouvelle animation Lottie
            // NOTE: API exacte dépend de l'implémentation LVGL V9
            // Cette partie nécessite d'ajouter une action dans le composant lvgl
            // Exemple hypothétique:
            // id(current_weather_animation).set_src(animation_path);

  - platform: homeassistant
    id: temperature
    entity_id: sensor.temperature_home
    on_value:
      then:
        - lambda: |-
            char temp_str[10];
            snprintf(temp_str, sizeof(temp_str), "%.0f°C", id(temperature).state);
            // id(current_temp).set_text(temp_str);

  - platform: homeassistant
    id: humidity
    entity_id: sensor.humidity_home
    on_value:
      then:
        - lambda: |-
            char hum_str[10];
            snprintf(hum_str, sizeof(hum_str), "%.0f%%", id(humidity).state);
            // id(humidity_value).set_text(hum_str);


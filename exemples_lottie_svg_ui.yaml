#   │   ├── clear-day.json
#   │   ├── clear-night.json
#   │   ├── cloudy.json
#   │   ├── partly-cloudy-day.json
#   │   ├── rain.json
#   │   ├── extreme-rain.json
#   │   ├── snow.json
#   │   ├── thunderstorms.json
#   │   ├── fog.json
#   │   └── wind.json
#   │
#   ├── icons/                        # Icônes SVG vectorielles
#   │   ├── sun.svg
#   │   ├── moon.svg
#   │   ├── cloud.svg
#   │   ├── cloud-sun.svg
#   │   ├── rain.svg
#   │   ├── rain-heavy.svg
#   │   ├── snow.svg
#   │   ├── lightning.svg
#   │   ├── fog.svg
#   │   ├── wind.svg
#   │   ├── humidity.svg
#   │   ├── play.svg
#   │   ├── pause.svg
#   │   ├── skip-back.svg
#   │   ├── skip-forward.svg
#   │   ├── check-circle.svg
#   │   └── alert-circle.svg
#   │
#   ├── animations/                   # Autres animations Lottie
#   │   ├── loading.json              # Spinner de chargement

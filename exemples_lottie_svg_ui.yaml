# ============================================================================
# RESSOURCES POUR TÉLÉCHARGER LES FICHIERS
# ============================================================================
#
# 🌤️ ANIMATIONS MÉTÉO LOTTIE (Basmilius):
#   https://github.com/basmilius/weather-icons/tree/dev/production/lottie
#
# 🎨 ICÔNES SVG GRATUITES:
#   - Remix Icon: https://remixicon.com/ (2800+ icônes open-source)
#   - Heroicons: https://heroicons.com/ (minimalistes)
#   - Lucide: https://lucide.dev/ (modernes)
#   - Feather Icons: https://feathericons.com/ (simple)
#
# 💫 ANIMATIONS LOTTIE GRATUITES:
#   - LottieFiles: https://lottiefiles.com/
#   - Lordicon: https://lordicon.com/ (animated icons)
#
# 📐 CONVERTIR SVG (si besoin):
#   - SVGO: https://jakearchibald.github.io/svgomg/ (optimiser SVG)
#   - SVG to path: pour simplifier les SVG complexes

# ============================================================================
# TIPS & ASTUCES
# ============================================================================
#
# 1. OPTIMISER LA TAILLE DES FICHIERS LOTTIE:
#    - Utilisez https://lottiefiles.com/tools/lottie-editor
#    - Réduisez le FPS à 30 (au lieu de 60)
#    - Simplifiez les layers inutiles
#    - Compressez le JSON
#
# 2. OPTIMISER LES SVG:
#    - Passez par SVGO: https://jakearchibald.github.io/svgomg/
#    - Supprimez les métadonnées
#    - Convertissez les text en paths
#    - Utilisez des couleurs simples (pas de gradients complexes)
#
# 3. PERFORMANCE:
#    - Lottie: 1-3 animations max simultanées
#    - SVG: illimité (rendu très rapide)
#    - Cache activé dans lvgl_advanced_features: img_cache_size: 16
#
# 4. DEBUGGING:
#    - Activez logs: lvgl: log_level: DEBUG
#    - Vérifiez chemins fichiers: ls /sdcard/weather/
#    - Testez fichiers Lottie: https://lottiefiles.com/preview
#    - Validez SVG: https://validator.w3.org/

# ============================================================================
# PROCHAINES ÉTAPES
# ============================================================================
#
# 1. Téléchargez les fichiers météo Basmilius et placez dans /sdcard/weather/
# 2. Téléchargez des icônes SVG et placez dans /sdcard/icons/
# 3. Testez avec l'exemple 1 (page météo)
# 4. Adaptez à votre configuration Home Assistant
# 5. Profitez des animations fluides 60 FPS ! 🎉

#       - storage.load_image: sandy_f06
#       - storage.load_image: sandy_f07
#       - storage.load_image: sandy_f08
#       - storage.load_image: sandy_f09
#       - storage.load_image: sandy_f10
#       - storage.load_image: sandy_f11
#       - storage.load_image: sandy_f12

#       # ... (toutes les frames)


# ============================================================================
# USAGE RAM ESTIMÉ
# ============================================================================
#
# Animation Sandy Loading (12 frames × 100x100 RGB565):
# - Par frame: 100 × 100 × 2 bytes = 20 KB
# - Total: 12 × 20 KB = 240 KB
#
# Si vous avez d'autres animations:
# - Alarm 6 frames × 64x64 = 49 KB
# - Heart 12 frames × 80x80 = 154 KB
# - Total global: ~443 KB
#
# Acceptable sur ESP32-P4 avec PSRAM
#
# ============================================================================



# ========================================================================
# SECURITY PAGE - AVEC VÉRIFICATION WIFI
# ========================================================================
# Attend que le WiFi soit connecté avant de démarrer les caméras
# Évite l'erreur "Host is unreachable (errno 118)"
# ========================================================================

      - id: security_page
        bg_color: 0x1a1a1a
        on_load:
          - lambda: |-
              ESP_LOGI("security", "Security page loaded");
              // Ne démarre PAS les caméras ici - attendre le bouton START
        widgets:

          # ==============================================================
          # CANVAS
          # ==============================================================
          - canvas:
              id: security_canvas
              width: 640
              height: 480
              x: 10
              y: 10
              bg_color: 0x000000

          # ==============================================================
          # TITRE
          # ==============================================================
          - label:
              id: security_title
              text: "SECURITY"
              x: 660
              y: 10
              text_color: 0xFFFFFF
              text_font: nunito_24
              text_align: LEFT

          # ==============================================================
          # STATUT WIFI (NOUVEAU!)
          # ==============================================================
          - label:
              id: wifi_status
              text: "WiFi: Checking..."
              x: 660
              y: 40
              text_color: 0xFFFF00
              text_font: nunito_20
              text_align: LEFT

          # ==============================================================
          # BOUTON RETOUR
          # ==============================================================
          - button:
              id: security_back
              width: 100
              height: 40
              x: 690
              y: 60
              bg_color: 0xe74c3c
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Stopping all cameras");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;
                  - lvgl.page.show: page_home
              widgets:
                - label:
                    text: "BACK"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON START ALL (avec vérification WiFi)
          # ==============================================================
          - button:
              id: btn_start_all
              width: 100
              height: 40
              x: 690
              y: 120
              bg_color: 0x27ae60
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0x27ae60
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      // ===== VÉRIFIER LA CONNEXION WIFI =====
                      auto wifi_component = wifi::global_wifi_component;
                      if (wifi_component == nullptr || !wifi_component->is_connected()) {
                        ESP_LOGW("security", "⚠ WiFi not connected! Waiting...");
                        // Mettre à jour le label
                        lv_label_set_text(id(wifi_status), "WiFi: Not Ready");
                        lv_obj_set_style_text_color(id(wifi_status), lv_color_hex(0xFF0000), 0);
                        return;
                      }

                      ESP_LOGI("security", "✓ WiFi connected");
                      lv_label_set_text(id(wifi_status), "WiFi: Connected");
                      lv_obj_set_style_text_color(id(wifi_status), lv_color_hex(0x00FF00), 0);

                      // ===== CONFIGURER LE CANVAS =====
                      static bool canvas_configured = false;
                      if (!canvas_configured) {
                        auto canvas = id(security_canvas);
                        if (canvas != nullptr) {
                          lv_coord_t w = lv_obj_get_width(canvas);
                          lv_coord_t h = lv_obj_get_height(canvas);
                          ESP_LOGI("security", "Canvas size: %dx%d", w, h);

                          if (w > 0 && h > 0) {
                            id(security_display).configure_canvas(canvas);
                            canvas_configured = true;
                            ESP_LOGI("security", "✓ Canvas configured");
                          } else {
                            ESP_LOGE("security", "❌ Canvas has invalid size!");
                            return;
                          }
                        }
                      }

                      // ===== DÉMARRER LA CAMÉRA =====
                      ESP_LOGI("security", "▶ Starting camera");
                      id(security_cam_1).set_enabled(true);
                      id(cam1_state) = true;
              widgets:
                - label:
                    text: "START"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON STOP ALL
          # ==============================================================
          - button:
              id: btn_stop_all
              width: 100
              height: 40
              x: 690
              y: 180
              bg_color: 0xe74c3c
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "■ Stopping all cameras");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;
              widgets:
                - label:
                    text: "STOP"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON TOGGLE CAM 1
          # ==============================================================
          - button:
              id: btn_cam1_toggle
              width: 80
              height: 30
              x: 690
              y: 240
              bg_color: 0x3498db
              bg_opa: COVER
              radius: 15
              on_click:
                then:
                  - lambda: |-
                      // Vérifier WiFi avant toggle
                      auto wifi_component = wifi::global_wifi_component;
                      if (wifi_component == nullptr || !wifi_component->is_connected()) {
                        ESP_LOGW("security", "⚠ WiFi not connected!");
                        return;
                      }

                      id(cam1_state) = !id(cam1_state);
                      id(security_cam_1).set_enabled(id(cam1_state));
                      ESP_LOGI("security", "Camera 1: %s", id(cam1_state) ? "ON" : "OFF");
              widgets:
                - label:
                    text: "CAM 1"
                    text_color: 0xFFFFFF
                    text_font: nunito_20
                    text_align: CENTER
                    align: CENTER

# ========================================================================
# ALTERNATIVE : DÉMARRAGE AUTOMATIQUE APRÈS CONNEXION WIFI
# ========================================================================
# Si vous voulez démarrer automatiquement les caméras après connexion WiFi :

# Dans la section wifi: de votre p4mini.yaml, ajoutez :

wifi:
  ssid: "VotreSSID"
  password: "VotrePassword"

  # Callback quand WiFi est connecté
  on_connect:
    - lambda: |-
        ESP_LOGI("wifi", "✓ WiFi connected - IP: %s", wifi::global_wifi_component->get_ip_address().str().c_str());
        // Optionnel: Démarrer les caméras automatiquement
        // id(security_cam_1).set_enabled(true);

  on_disconnect:
    - lambda: |-
        ESP_LOGW("wifi", "⚠ WiFi disconnected - stopping cameras");
        id(security_cam_1).set_enabled(false);
        id(cam1_state) = false;

# ========================================================================
# ALTERNATIVE 2 : TIMER DE DÉMARRAGE DIFFÉRÉ
# ========================================================================
# Démarrer les caméras 5 secondes après le boot (temps pour WiFi)

# Dans la section esphome:
esphome:
  on_boot:
    priority: -100  # Après tout le reste
    then:
      - delay: 5s  # Attendre 5 secondes pour le WiFi
      - lambda: |-
          auto wifi_component = wifi::global_wifi_component;
          if (wifi_component != nullptr && wifi_component->is_connected()) {
            ESP_LOGI("boot", "✓ WiFi ready after boot delay");
          } else {
            ESP_LOGW("boot", "⚠ WiFi still not ready after 5s");
          }

# ========================================================================
# RÉSUMÉ DES AMÉLIORATIONS
# ========================================================================
#
# ✅ Vérification WiFi avant de démarrer les caméras
# ✅ Label de statut WiFi (Connected/Not Ready)
# ✅ Retour immédiat si WiFi non connecté (évite errno 118)
# ✅ Couleur du label change selon l'état (vert=OK, rouge=KO)
# ✅ Protection sur tous les boutons (START, TOGGLE)
#
# ========================================================================

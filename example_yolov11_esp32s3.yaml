# ============================================================================
# Example: YOLO / ESPDet-Pico detection on ESP32-S3 with standard ESP32 camera
# ============================================================================
# Lightweight object detection using the `yolov11` component.
#
# Recommended model: `espdet_pico` (Espressif's ultra-light detector)
#   - ~0.36M parameters
#   - ~7+ FPS on ESP32-S3 with PSRAM
#   - Same COCO-80 classes as YOLO11, much faster
#
# The model file (.espdl) is loaded from flash via the `file` component.
# Get ESPDet-Pico from:
#   https://github.com/espressif/esp-detection
# Or reuse `coco_detect_yolo11n_320_s8_v3.espdl` from:
#   https://github.com/espressif/esp-dl/tree/master/models/coco_detect
# ============================================================================

esphome:
  name: esp32-s3-yolov11
  friendly_name: "ESP32-S3 YOLO"

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/test2_esp_video_esphome
    components:
      - file
      - yolov11

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      # PSRAM (Octal) — required for YOLO / ESPDet-Pico
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_MODE_OCT: y
      CONFIG_SPIRAM_SPEED_80M: y
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # Bigger stacks for inference
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  logs:
    yolov11: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

# ============================================================================
# Model file (.espdl) embedded from flash
# ============================================================================
file:
  - id: yolo_model
    # Place the .espdl file next to this YAML before compiling.
    # Example: coco_detect_yolo11n_320_s8_v3.espdl (~2.8 MB)
    #          or ESPDet-Pico .espdl (~0.5-1 MB)
    path: "coco_detect_yolo11n_320_s8_v3.espdl"

# ============================================================================
# Camera (ESP32-S3 standard DVP camera)
# Pin mapping: ESP32-S3-EYE / Freenove / adjust to your board
# ============================================================================
esp32_camera:
  id: s3_cam
  name: "S3 Camera"
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_pins:
    sda: GPIO4
    scl: GPIO5
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  resolution: 320x240       # Matches detector input — fastest
  jpeg_quality: 10
  max_framerate: 10 fps
  idle_framerate: 2 fps

# ============================================================================
# YOLO detection (use `espdet_pico` for best speed on S3)
# ============================================================================
yolov11:
  id: yolo_detect
  esp32_camera_id: s3_cam
  model_id: yolo_model
  model_type: espdet_pico      # Options: yolo11 | yolo26n | espdet_pico
  score_threshold: 0.25
  nms_threshold: 0.7
  detection_interval: 1        # Run on every available frame
  draw_enabled: true

  # Optional: filter classes (indices are COCO-80).
  # Example — person(0), cat(15), dog(16):
  # detect_classes: [0, 15, 16]

# ============================================================================
# Text sensors exposing detections over Home Assistant
# ============================================================================
text_sensor:
  - platform: yolov11
    yolov11_id: yolo_detect
    detection_id:
      name: "Detected Classes"
    detection_bb:
      name: "Detection Bounding Boxes"

# ============================================================================
# Diagnostics
# ============================================================================
interval:
  - interval: 30s
    then:
      - lambda: |-
          size_t free_int = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          ESP_LOGI("mem", "Internal free: %u KB | PSRAM free: %u KB",
                   (unsigned)(free_int / 1024),
                   (unsigned)(free_psram / 1024));

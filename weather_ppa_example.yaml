# ============================================================================
# STRUCTURE DES FICHIERS SUR SD CARD
# ============================================================================
# /sdcard/
# └── weather/
#     ├── sunny.gif      # Soleil animé (64x64 recommandé)
#     ├── cloudy.gif     # Nuages animés
#     ├── rainy.gif      # Pluie animée
#     ├── snowy.gif      # Neige animée
#     └── stormy.gif     # Orage animé
#
# Vous pouvez télécharger des GIF météo animés depuis:
# - https://iconscout.com/lottie-animations/weather-icons (convertir en GIF)
# - https://giphy.com/search/weather-icon
# - Convertir les SVG Basmilius avec ezgif.com
#
# Taille recommandée: 64x64 pixels (le PPA scalera vers 128x128)
# Format: GIF animé, palette 256 couleurs max
# ============================================================================

# ============================================================================
# NOTES DE PERFORMANCE
# ============================================================================
# Sans PPA (CPU software scaling):
#   - Scale 64→128 RGB565: ~15ms par frame
#   - À 10 FPS: ~150ms/sec = 15% CPU
#
# Avec PPA (hardware scaling):
#   - Scale 64→128 RGB565: ~1.5ms par frame
#   - À 10 FPS: ~15ms/sec = 1.5% CPU
#
# Gain: ~10x plus rapide, CPU libéré pour autres tâches
# ============================================================================

# ============================================================================
# WEATHER ICONS WITH PPA ACCELERATION - ESP32-P4
# ============================================================================
# Exemple d'utilisation du PPA pour accélérer l'affichage des icônes météo
# animées (GIF) sur ESP32-P4
# ============================================================================

external_components:
  - source:
      type: local
      path: components
    components:
      - sd_mmc_card
      - storage
      - ppa_accelerator
      - lvgl_camera_display

# ============================================================================
# SD CARD - Stockage des icônes météo
# ============================================================================
sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  mode_1bit: false
  slot: 0

# ============================================================================
# PPA ACCELERATOR - Accélération hardware
# ============================================================================
ppa_accelerator:
  id: ppa

# ============================================================================
# STORAGE - Images météo sur SD
# ============================================================================
storage:
  platform: sd_direct
  id: my_storage
  sd_component: sd_card
  root_path: "/sdcard"
  sd_images:
    # Icônes météo animées (GIF) - taille native 64x64
    # Le PPA fera le scaling hardware vers la taille d'affichage
    - id: weather_sunny
      file_path: "/weather/sunny.gif"
      format: rgb565
      auto_load: false

    - id: weather_cloudy
      file_path: "/weather/cloudy.gif"
      format: rgb565
      auto_load: false

    - id: weather_rainy
      file_path: "/weather/rainy.gif"
      format: rgb565
      auto_load: false

    - id: weather_snowy
      file_path: "/weather/snowy.gif"
      format: rgb565
      auto_load: false

    - id: weather_stormy
      file_path: "/weather/stormy.gif"
      format: rgb565
      auto_load: false

# ============================================================================
# GLOBALS
# ============================================================================
globals:
  - id: current_weather_state
    type: std::string
    initial_value: '"cloudy"'

  # Buffer pour l'icône scalée par PPA
  - id: scaled_icon_buffer
    type: uint8_t*
    initial_value: 'nullptr'

  - id: scaled_icon_width
    type: int
    initial_value: '128'

  - id: scaled_icon_height
    type: int
    initial_value: '128'

# ============================================================================
# SENSORS - Météo depuis Home Assistant
# ============================================================================
text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home
    on_value:
      then:
        - lambda: |-
            std::string state = id(weather_condition).state;
            id(current_weather_state) = state;

            // Charger l'icône correspondante
            if (state == "sunny" || state == "clear-night") {
              id(weather_sunny).load_image();
            } else if (state == "cloudy" || state == "partlycloudy") {
              id(weather_cloudy).load_image();
            } else if (state == "rainy" || state == "pouring") {
              id(weather_rainy).load_image();
            } else if (state == "snowy" || state == "snowy-rainy") {
              id(weather_snowy).load_image();
            } else if (state == "lightning" || state == "lightning-rainy") {
              id(weather_stormy).load_image();
            } else {
              id(weather_cloudy).load_image();  // Par défaut
            }

            ESP_LOGI("weather", "Weather changed to: %s", state.c_str());

sensor:
  - platform: homeassistant
    id: weather_temp
    entity_id: weather.home
    attribute: temperature

  - platform: homeassistant
    id: weather_humidity
    entity_id: weather.home
    attribute: humidity

# ============================================================================
# INTERVAL - Animation GIF avec PPA scaling
# ============================================================================
interval:
  - interval: 100ms  # ~10 FPS pour l'animation
    then:
      - lambda: |-
          // Obtenir le PPA
          auto* ppa = ppa_accelerator::get_ppa_accelerator();
          if (!ppa || !ppa->is_available()) {
            return;  // PPA non disponible
          }

          // Déterminer quelle icône est active
          storage::SdImageComponent* active_icon = nullptr;
          std::string state = id(current_weather_state);

          if (state == "sunny" || state == "clear-night") {
            active_icon = id(weather_sunny);
          } else if (state == "cloudy" || state == "partlycloudy") {
            active_icon = id(weather_cloudy);
          } else if (state == "rainy" || state == "pouring") {
            active_icon = id(weather_rainy);
          } else if (state == "snowy" || state == "snowy-rainy") {
            active_icon = id(weather_snowy);
          } else if (state == "lightning" || state == "lightning-rainy") {
            active_icon = id(weather_stormy);
          } else {
            active_icon = id(weather_cloudy);
          }

          if (!active_icon || !active_icon->is_loaded()) {
            return;  // Icône non chargée
          }

          // L'animation GIF est gérée automatiquement par le composant storage
          // Le PPA peut être utilisé pour scaler l'image si nécessaire

          // Exemple: Scaler l'icône 64x64 vers 128x128 avec PPA
          /*
          int src_w = active_icon->get_width();
          int src_h = active_icon->get_height();
          int dst_w = id(scaled_icon_width);
          int dst_h = id(scaled_icon_height);

          if (src_w != dst_w || src_h != dst_h) {
            // Allouer le buffer de sortie si nécessaire

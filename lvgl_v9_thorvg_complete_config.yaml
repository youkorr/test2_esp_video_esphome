# ============================================================================
# CONFIGURATION COMPLÈTE LVGL V9 avec ThorVG/SVG/Lottie
# ============================================================================
# Configuration pour ESP32-P4 avec LVGL V9.4 et fonctionnalités avancées
#
# NOUVELLES FONCTIONNALITÉS ACTIVÉES:
#   ✅ LVGL V9.4 (migration depuis V8)
#   ✅ ThorVG (moteur de rendu vectoriel haute performance)
#   ✅ Support SVG natif (icônes vectorielles, logos, graphiques)
#   ✅ Support Lottie (animations vectorielles fluides)
#   ✅ Optimisations caméra et vidéo
#   ✅ Support GIF, PNG, BMP, QR codes
#
# AVANTAGES POUR VOTRE PROJET:
#   🎨 Icônes météo animées (Lottie) - animations fluides sans CPU
#   📹 Caméra plus fluide - optimisations buffer et rendering
#   🎬 Lecteur vidéo amélioré - sync A/V optimisée
#   💾 Moins de mémoire - graphiques vectoriels vs bitmap
#   ⚡ Plus rapide - ThorVG utilise GPU/PPA ESP32-P4
# ============================================================================

# ============================================================================
# EXTERNAL COMPONENTS - LVGL V9.4
# ============================================================================
external_components:
  # LVGL v9.4 depuis le fork de clydebarrow
  - source:
      type: git
      url: https://github.com/clydebarrow/esphome
      ref: lvgl-9.4
    components:
      - lvgl
      - font
      - image
    refresh: 1d

  # Composants locaux (incluant le nouveau lvgl_advanced_features)
  - source:
      type: local
      path: components
    components:
      - sd_mmc_card
      - storage
      - mipi_dsi_cam
      - lvgl_camera_display
      - avi_player
      - simple_video_player
      - multi_camera_display
      - lvgl_advanced_features  # 🆕 NOUVEAU composant pour ThorVG/SVG/Lottie


# ============================================================================
# 🆕 LVGL ADVANCED FEATURES - ThorVG/SVG/Lottie
# ============================================================================
lvgl_advanced_features:
  # ThorVG - Moteur de rendu vectoriel haute performance
  # ThorVG utilise le GPU/PPA de l'ESP32-P4 pour le rendu accéléré
  thorvg:
    internal: true    # Utiliser la version ThorVG intégrée à LVGL
    external: false   # Pas de ThorVG externe

  # Support SVG natif (nécessite ThorVG)
  # Permet d'utiliser des icônes et graphiques SVG
  # Exemple: icônes météo, logos, graphiques vectoriels
  svg: true

  # Support Lottie (nécessite ThorVG)
  # Permet d'utiliser des animations Lottie (JSON)
  # Exemple: animations météo de Basmilius Weather Icons
  # https://github.com/basmilius/weather-icons
  lottie: true

  # Support de formats d'images supplémentaires
  gif: true      # Animations GIF (alternative à Lottie pour animations simples)
  bmp: true      # Images BMP
  # libpng: false    # PNG via libpng (déjà supporté par ESP-IDF)
  # libjpeg_turbo: false  # JPEG via libjpeg-turbo (déjà supporté par ESP32-P4)

  # Widgets supplémentaires
  qrcode: true   # Widget QR code (utile pour partage WiFi, URLs, etc.)
  barcode: false # Widget code-barres (désactivé par défaut)

  # Optimisations de performance
  draw_sw_complex: true      # Active le rendu complexe (ombres, gradients)
  shadow_cache_size: 16      # Cache pour ombres (16 éléments) - économise CPU
  img_cache_size: 8          # Cache pour images (8 éléments) - réduit lectures SD


# ============================================================================
# 📁 FICHIERS POUR TESTER LES NOUVELLES FONCTIONNALITÉS
# ============================================================================
#
# 1. ICÔNES SVG:
#    Téléchargez des icônes SVG gratuites:
#    - https://remixicon.com/ (icônes open-source)
#    - https://heroicons.com/ (icônes minimalistes)
#    Placez dans: /sdcard/icons/*.svg
#
# 2. ANIMATIONS LOTTIE:
#    Téléchargez les animations météo Basmilius:
#    - https://github.com/basmilius/weather-icons/tree/dev/production/lottie
#    Fichiers disponibles:
#      - clear-day.json, clear-night.json
#      - cloudy.json, partly-cloudy-day.json
#      - rain.json, snow.json, thunderstorms.json
#      - wind.json, fog.json
#    Placez dans: /sdcard/weather/*.json
#
# 3. VIDÉOS OPTIMISÉES:
#    Encodez vos vidéos en AVI MJPEG:
#
#    # Pour ESP32-P4 @ 800x480:
#    ffmpeg -i input.mp4 \
#      -vf scale=800:480 \
#      -vcodec mjpeg \
#      -q:v 3 \
#      -acodec pcm_s16le \
#      -ar 16000 \
#      -ac 1 \
#      output.avi
#
#    Placez dans: /sdcard/video/*.avi


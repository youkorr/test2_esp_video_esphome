# ============================================================================
# 🔧 DÉPANNAGE
# ============================================================================
#
# PROBLÈME: "ThorVG: DISABLED" dans les logs
# SOLUTION: Vérifiez que vous utilisez bien la branche lvgl-9.4 de clydebarrow
#           et que lvgl_advanced_features est chargé AVANT lvgl dans la config
#
# PROBLÈME: Compilation échoue avec erreur C++
# SOLUTION: ThorVG nécessite C++17. Ajoutez dans platformio_options:
#           build_flags: -std=gnu++17
#
# PROBLÈME: Fichiers Lottie ne se chargent pas
# SOLUTION: Vérifiez le format JSON des fichiers Lottie
#           Vérifiez que les fichiers sont sur la carte SD au bon chemin
#           Activez les logs LVGL: lvgl: log_level: DEBUG
#
# PROBLÈME: Performance dégradée avec ThorVG
# SOLUTION: ThorVG utilise plus de RAM. Sur ESP32-P4 avec PSRAM c'est OK.
#           Augmentez buffer_size si nécessaire
#           Réduisez shadow_cache_size et img_cache_size si RAM insuffisante
#
# PROBLÈME: Caméra moins fluide après migration V9
# SOLUTION: Augmentez buffer_size LVGL à 25-30%
#           Vérifiez update_interval du lvgl_camera_display (33ms = 30 FPS)
#           Désactivez les logs DEBUG en production

# ============================================================================
# 📊 MESURES DE PERFORMANCE ATTENDUES
# ============================================================================
#
# AVEC LVGL V8 (avant migration):
#   - Caméra: ~25-28 FPS
#   - Lecteur vidéo: ~24 FPS avec drops occasionnels
#   - RAM utilisée: ~8-10 MB
#   - CPU usage: 60-70%
#
# AVEC LVGL V9 + ThorVG (après migration):
#   - Caméra: ~28-30 FPS stable
#   - Lecteur vidéo: ~30 FPS sans drops
#   - RAM utilisée: ~10-12 MB (ThorVG + caches)
#   - CPU usage: 45-55% (offload GPU/PPA)
#   - Animations Lottie: 60 FPS fluides (rendu vectoriel)
#   - SVG rendering: instant (pas de décodage bitmap)


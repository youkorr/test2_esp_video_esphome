# ========================================================================
# PAGE SECURITY - VERSION CORRIGÉE SANS ERREURS
# ========================================================================
# Cette configuration est prête à être copiée dans votre p4mini.yaml
# ========================================================================

# ⚠️ IMPORTANT: Ajoutez d'abord ces variables globales en haut de votre fichier p4mini.yaml
# Dans la section après "esphome:" et avant "lvgl:"
#
# globals:
#   - id: cam1_state
#     type: bool
#     initial_value: 'false'
#

# ========================================================================
# PAGE SECURITY (à copier dans votre section lvgl -> pages)
# ========================================================================

      - id: security_page
        bg_color: 0x1a1a1a  # Fond gris foncé comme camera_page
        on_load:
          - lambda: |-
              ESP_LOGI("security", "Security page loaded");
              static bool canvas_configured = false;
              if (!canvas_configured) {
                auto canvas = id(security_canvas);
                if (canvas != nullptr) {
                  id(security_display).configure_canvas(canvas);  # ✅ CORRIGÉ: security_display au lieu de tab5_cam
                  canvas_configured = true;
                  ESP_LOGI("security", "✓ Security canvas configured");
                }
              }
        widgets:

          # ==============================================================
          # CANVAS - Grille 2x2 pour 4 caméras (ou plein écran)
          # ==============================================================
          - canvas:
              id: security_canvas
              width: 640   # Ajustez selon votre écran
              height: 480  # Grille 2x2: chaque caméra sera 320x240
              x: 10
              y: 10
              bg_color: 0x000000

          # ==============================================================
          # TITRE DE LA PAGE
          # ==============================================================
          - label:
              id: security_title
              text: "SECURITY"
              x: 660
              y: 10
              text_color: 0xFFFFFF
              text_font: nunito_24
              text_align: LEFT

          # ==============================================================
          # BOUTON RETOUR
          # ==============================================================
          - button:
              id: security_back
              width: 100
              height: 40
              x: 690
              y: 60
              bg_color: 0xe74c3c
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Stopping all cameras and returning home");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;  # ✅ AJOUTÉ: Mettre à jour l'état
                  - lvgl.page.show: page_home
              widgets:
                - label:
                    text: "BACK"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON START ALL
          # ==============================================================
          - button:
              id: btn_start_all
              width: 100
              height: 40
              x: 690
              y: 120
              bg_color: 0x27ae60  # Vert
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0x27ae60
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Starting all cameras");
                      id(security_cam_1).set_enabled(true);
                      id(cam1_state) = true;  # ✅ AJOUTÉ: Mettre à jour l'état
              widgets:
                - label:
                    text: "START"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON STOP ALL
          # ==============================================================
          - button:
              id: btn_stop_all
              width: 100
              height: 40
              x: 690
              y: 180
              bg_color: 0xe74c3c  # Rouge
              bg_opa: COVER
              radius: 20
              shadow_width: 6
              shadow_color: 0xe74c3c
              shadow_opa: 80%
              on_click:
                then:
                  - lambda: |-
                      ESP_LOGI("security", "Stopping all cameras");
                      id(security_cam_1).set_enabled(false);
                      id(cam1_state) = false;  # ✅ AJOUTÉ: Mettre à jour l'état
              widgets:
                - label:
                    text: "STOP"
                    text_color: 0xFFFFFF
                    text_font: nunito_24
                    text_align: CENTER
                    align: CENTER

          # ==============================================================
          # BOUTON TOGGLE CAMÉRA 1
          # ==============================================================
          - button:
              id: btn_cam1_toggle
              width: 80
              height: 30
              x: 690
              y: 240
              bg_color: 0x3498db
              bg_opa: COVER
              radius: 15
              on_click:
                then:
                  - lambda: |-
                      # ✅ CORRIGÉ: Utiliser la variable globale au lieu de is_enabled()
                      id(cam1_state) = !id(cam1_state);
                      id(security_cam_1).set_enabled(id(cam1_state));
                      ESP_LOGI("security", "Camera 1: %s", id(cam1_state) ? "ON" : "OFF");
              widgets:
                - label:
                    text: "CAM 1"
                    text_color: 0xFFFFFF
                    text_font: nunito_20
                    text_align: CENTER
                    align: CENTER

# ========================================================================
# CONFIGURATION COMPLÈTE À AJOUTER DANS P4MINI.YAML
# ========================================================================

# 1. EN HAUT DU FICHIER (après esphome:, avant lvgl:)
# -------------------------------------------------------
# Ajoutez cette section globals:

globals:
  - id: cam1_state
    type: bool
    initial_value: 'false'

# 2. DANS LA SECTION network_camera:
# -------------------------------------------------------
# Ajoutez votre caméra de sécurité:

network_camera:
  - id: security_cam_1
    url: "rtsp://Tapoone:Tapoone132@192.168.1.56:554/stream1"
    protocol: rtsp
    width: 320
    height: 240
    canvas_id: security_canvas  # Sera remplacé par multi_camera_display
    update_interval: 100ms

# 3. AJOUTEZ LA CONFIGURATION multi_camera_display:
# -------------------------------------------------------

multi_camera_display:
  id: security_display
  canvas_id: security_canvas
  cameras:
    - camera_id: security_cam_1

# 4. DANS LA SECTION lvgl: -> pages:
# -------------------------------------------------------
# Copiez la page security_page ci-dessus

# ========================================================================
# RÉSUMÉ DES CORRECTIONS
# ========================================================================
#
# ✅ Ligne on_load: id(security_display).configure_canvas(canvas)
#    (au lieu de id(tab5_cam).configure_canvas(canvas))
#
# ✅ Bouton toggle: id(cam1_state) = !id(cam1_state)
#    (au lieu de bool current = id(security_cam_1).is_enabled())
#
# ✅ Ajout de la mise à jour des états globaux dans tous les boutons
#
# ========================================================================

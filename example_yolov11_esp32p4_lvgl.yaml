# ============================================================================
# Example: YOLO / ESPDet-Pico detection on ESP32-P4 with MIPI-DSI camera
# + LVGL live preview with overlay bounding boxes
# ============================================================================
# Uses:
#   - esp_cam_sensor (MIPI-DSI camera, e.g. OV5647)
#   - yolov11 component (supports yolo11, yolo26n, espdet_pico)
#   - lvgl_camera_display (live framebuffer blit onto an LVGL canvas)
#
# The `yolov11` component draws colored bounding boxes + class/percentage
# labels directly into the RGB565 framebuffer before it is blitted to LVGL.
#
# Recommended model: `espdet_pico` (~18+ FPS on P4).
# The model file (.espdl) is loaded from flash via the `file` component.
# ============================================================================

esphome:
  name: esp32-p4-yolov11-lvgl
  friendly_name: "ESP32-P4 YOLO + LVGL"

external_components:
  - source:
      type: git
      url: https://github.com/youkorr/test2_esp_video_esphome
    components:
      - file
      - esp_cam_sensor
      - yolov11
      - lvgl_camera_display

esp32:
  board: esp32-p4-function-ev-board
  variant: esp32p4
  framework:
    type: esp-idf
    sdkconfig_options:
      # PSRAM (16 MB @ 200 MHz)
      CONFIG_SPIRAM: y
      CONFIG_SPIRAM_SPEED_200M: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_SPIRAM_USE_CAPS_ALLOC: y
      CONFIG_SPIRAM_USE_MALLOC: y
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "16384"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      # L2 cache tuned for PSRAM
      CONFIG_CACHE_L2_CACHE_256KB: y
      CONFIG_CACHE_L2_CACHE_LINE_128B: y
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

psram:

logger:
  level: INFO
  logs:
    yolov11: INFO
    esp_cam_sensor: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
ota:
  - platform: esphome

# ============================================================================
# Model file (.espdl) embedded from flash
# ============================================================================
file:
  - id: yolo_model
    path: "coco_detect_yolo11n_320_s8_v3.espdl"

# ============================================================================
# I2C bus used by the MIPI-DSI camera SCCB
# ============================================================================
i2c:
  - id: bsp_bus
    sda: GPIO7
    scl: GPIO8
    frequency: 100kHz

# ============================================================================
# MIPI-DSI camera (OV5647 by default — change `sensor_type` for your sensor)
# ============================================================================
esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: ov5647
  sensor_addr: 0x36
  resolution: "VGA"        # 640x480 — kept at 1:1 for the canvas
  pixel_format: RGB565
  framerate: 30

# ============================================================================
# YOLO detection — ESPDet-Pico for max FPS on P4
# ============================================================================
yolov11:
  id: yolo_detect
  camera_id: tab5_cam          # MIPI-DSI camera
  canvas_id: camera_canvas     # Draw overlay onto this LVGL canvas
  model_id: yolo_model
  model_type: espdet_pico      # Options: yolo11 | yolo26n | espdet_pico
  score_threshold: 0.25
  nms_threshold: 0.7
  detection_interval: 1
  draw_enabled: true
  # Detect only person (0), cat (15), dog (16) — COCO-80 indices
  detect_classes: [0, 15, 16]

text_sensor:
  - platform: yolov11
    yolov11_id: yolo_detect
    detection_id:
      name: "Detected Classes"
    detection_bb:
      name: "Detection Bounding Boxes"

# ============================================================================
# LVGL live camera display with YOLO overlay
# ============================================================================
lvgl_camera_display:
  id: camera_display
  camera_id: tab5_cam
  canvas_id: camera_canvas
  update_interval: 100ms       # ~10 FPS blit (avoids watchdog)
  yolov11_id: yolo_detect      # YOLO draws boxes + labels into the framebuffer

# ============================================================================
# LVGL UI (800x480 target — adjust to your panel)
# ============================================================================
lvgl:
  pages:
    - id: camera_page
      bg_color: 0x000000
      on_load:
        - lambda: |-
            ESP_LOGI("ui", "Camera + YOLO page loaded");
            id(tab5_cam).start_streaming();

      widgets:
        # ------------------------------------------------------------
        # Camera canvas (centered, 640x480)
        # ------------------------------------------------------------
        - canvas:
            id: camera_canvas
            width: 640
            height: 480
            x: 80
            y: 0
            bg_color: 0x000000

        # ------------------------------------------------------------
        # Control strip on the left
        # ------------------------------------------------------------
        - button:
            id: btn_start
            width: 70
            height: 45
            x: 5
            y: 10
            bg_color: 0x00AA00
            radius: 8
            on_click:
              then:
                - lambda: |-
                    if (id(tab5_cam).start_streaming()) {
                      lv_label_set_text(id(status_label), "YOLO");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_align: CENTER

        - button:
            id: btn_stop
            width: 70
            height: 45
            x: 5
            y: 65
            bg_color: 0xCC0000
            radius: 8
            on_click:
              then:
                - lambda: |-
                    id(tab5_cam).stop_streaming();
                    lv_label_set_text(id(status_label), "STOP");
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_align: CENTER

        - button:
            id: btn_infer
            width: 70
            height: 45
            x: 5
            y: 120
            bg_color: 0x4682B4
            radius: 8
            on_click:
              then:
                - lambda: |-
                    id(yolo_detect).request_inference();
                    ESP_LOGI("ui", "Inference requested");
            widgets:
              - label:
                  text: "INFER"
                  text_color: 0xFFFFFF
                  text_align: CENTER

        - button:
            id: btn_info
            width: 70
            height: 45
            x: 5
            y: 175
            bg_color: 0x333333
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("ui", "=== INFO ===");
                    ESP_LOGI("ui", "Sensor: OV5647 VGA (640x480)");
                    ESP_LOGI("ui", "Detections: %d",
                             id(yolo_detect).get_detected_count());
                    size_t psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
                    ESP_LOGI("ui", "PSRAM free: %u KB", (unsigned)(psram / 1024));
            widgets:
              - label:
                  text: "INFO"
                  text_color: 0xFFFFFF
                  text_align: CENTER

        # ------------------------------------------------------------
        # Status label (bottom-left)
        # ------------------------------------------------------------
        - label:
            id: status_label
            text: "READY"
            x: 10
            y: 450
            text_color: 0xFF8800

        # ------------------------------------------------------------
        # Live detection count (top-right)
        # ------------------------------------------------------------
        - label:
            id: detect_count_label
            text: "0 objects"
            x: 720
            y: 10
            text_color: 0x00FF00

# Refresh the detection count label once per second
interval:
  - interval: 1s
    then:
      - lambda: |-
          char buf[32];
          snprintf(buf, sizeof(buf), "%d objects",
                   id(yolo_detect).get_detected_count());
          lv_label_set_text(id(detect_count_label), buf);
  - interval: 30s
    then:
      - lambda: |-
          size_t free_int = heap_caps_get_free_size(MALLOC_CAP_INTERNAL);
          size_t free_psram = heap_caps_get_free_size(MALLOC_CAP_SPIRAM);
          ESP_LOGI("mem", "Internal free: %u KB | PSRAM free: %u KB",
                   (unsigned)(free_int / 1024),
                   (unsigned)(free_psram / 1024));

# Page caméra OV02C10 - 100% FOV avec Full HD
# Configuration: 1920×1080 + Rotation 270° → Canvas 480×390
# Aucun crop capteur (FOV parfait) mais plus de RAM/CPU

esp_cam_sensor:
  id: tab5_cam
  i2c_id: i2c_bus
  sensor_type: ov02c10
  resolution: "1920x1080"    # ← Full sensor, 0% crop, 100% FOV!
  pixel_format: "RGB565"
  framerate: 30
  jpeg_quality: 15
  rotation: 270              # → Devient 1080×1920 après rotation
  mirror_x: true
  mirror_y: false
  crop_offset_x: 0
  ppa_enabled: true          # ← IMPORTANT: PPA resize de 1080×1920 → 480×390

lvgl:
  pages:
    - id: camera_page
      bg_color: 0x1a1a1a
      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Camera page loaded (100%% FOV - Full HD!)");
            static bool canvas_configured = false;
            if (!canvas_configured) {
              auto canvas = id(camera_canvas);
              if (canvas != nullptr) {
                id(camera_display).configure_canvas(canvas);
                canvas_configured = true;
                ESP_LOGI("lvgl", "✓ Canvas 480×390 configured (1920×1080 downscaled)");
              }
            }
      widgets:

        # ==============================================================
        # CANVAS - Garde votre configuration actuelle (480×390)
        # ==============================================================
        - canvas:
            id: camera_canvas
            width: 480       # ← Garde votre largeur actuelle
            height: 390      # ← Garde votre hauteur actuelle
            x: 30            # ← Garde votre position actuelle
            y: 40
            bg_color: 0x000000

        # ==============================================================
        # BOUTONS DE CONTRÔLE (Configuration identique)
        # ==============================================================
        - button:
            id: camera_back
            width: 100
            height: 40
            x: 690
            y: 10
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Stopping and returning home");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

        - button:
            id: start_streaming
            width: 100
            height: 40
            x: 690
            y: 100
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  START STREAMING (1920×1080 → 100%% FOV!)");
                    if (id(tab5_cam).start_streaming()) {
                      ESP_LOGI("camera", "✓ Streaming started");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

        - button:
            id: btn_stop_streaming
            width: 100
            height: 40
            x: 690
            y: 160
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "⏹️  STOP STREAMING");
                    id(tab5_cam).stop_streaming();
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

# ==============================================================
# NOTES - OPTION FULL HD (1920×1080)
# ==============================================================
#
# ✅ AVANTAGES de 1920×1080:
#    - FOV parfait: 100% du capteur (aucun crop!)
#    - Qualité maximale: full resolution
#    - Canvas inchangé: garde 480×390
#    - Pas de upscale: PPA fait du downscale seulement
#
# ⚠️  INCONVÉNIENTS:
#    - RAM: ~6.2 MB (vs ~1.2 MB pour 640×480)
#    - CPU: PPA resize important (1080×1920 → 480×390)
#    - Risque: watchdog timeout si CPU surchargé
#    - Framerate: peut nécessiter réduction à 20fps
#
# 📐 DIMENSIONS:
#    - Capture: 1920×1080 (format 16:9, résolution native)
#    - Après rotation 270°: 1080×1920
#    - PPA downscale: 1080×1920 → 480×390 (55% de reduction)
#    - Canvas final: 480×390 (identique à votre config actuelle)
#
# 🔧 OPTIMISATIONS POSSIBLES:
#    Si vous rencontrez des watchdog timeouts:
#    1. Réduire framerate à 20fps:
#       framerate: 20
#    2. Augmenter update_interval LVGL:
#       update_interval: 150ms  # Au lieu de 100ms
#    3. Réduire jpeg_quality si utilisé:
#       jpeg_quality: 10  # Au lieu de 15
#
# 🔍 VÉRIFICATION:
#    Les logs devraient afficher:
#    "✅ Using NATIVE format: 1920x1080 RAW10 @ 30fps (1080P - Full Sensor)"
#
# 💡 QUAND UTILISER CETTE OPTION:
#    - Vous avez BEAUCOUP de RAM/CPU disponible
#    - Vous voulez la MEILLEURE qualité d'image possible
#    - Vous voulez 100% du FOV sans compromis
#    - Vous NE voulez PAS modifier votre canvas actuel
#

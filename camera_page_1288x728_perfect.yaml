# Page Caméra OV02C10 - Format 1288×728 (Parfait!)
# Résolution native, pas de crop, fonctionne parfaitement avec rotation 270°
# Canvas 480×390 - PAS de lignes transparentes, PAS de compression

esp_cam_sensor:
  id: tab5_cam
  i2c_id: i2c_bus
  sensor_type: ov02c10
  resolution: "1288x728"     # ← Format NATIF, ratio 16:9, 0% crop!
  pixel_format: "RGB565"
  framerate: 30
  jpeg_quality: 15
  rotation: 270              # → Devient 728×1288 après rotation
  mirror_x: true
  mirror_y: false
  crop_offset_x: 0
  ppa_enabled: true          # ← PPA downscale 728→480, 1288→390 (OK!)

lvgl:
  pages:
    - id: camera_page
      bg_color: 0x1a1a1a
      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Camera 1288×728 (NO CROP, 100% FOV!)");
            static bool canvas_configured = false;
            if (!canvas_configured) {
              auto canvas = id(camera_canvas);
              if (canvas != nullptr) {
                id(camera_display).configure_canvas(canvas);
                canvas_configured = true;
                ESP_LOGI("lvgl", "✓ Canvas 480×390 configured");
              }
            }
      widgets:

        # ==============================================================
        # CANVAS - 480×390 (VOTRE CONFIG ACTUELLE - AUCUN CHANGEMENT!)
        # ==============================================================
        - canvas:
            id: camera_canvas
            width: 480       # ← GARDE 480 (downscale 728→480 OK)
            height: 390      # ← GARDE 390 (downscale 1288→390 OK)
            x: 30            # ← GARDE position actuelle
            y: 40
            bg_color: 0x000000

        # ==============================================================
        # BOUTONS - AUCUN CHANGEMENT!
        # ==============================================================
        - button:
            id: camera_back
            width: 100
            height: 40
            x: 690
            y: 10
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Stopping and returning home");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

        - button:
            id: start_streaming
            width: 100
            height: 40
            x: 690
            y: 100
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  START (1288×728 → 100% FOV)");
                    if (id(tab5_cam).start_streaming()) {
                      ESP_LOGI("camera", "✓ Streaming started");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

        - button:
            id: btn_stop_streaming
            width: 100
            height: 40
            x: 690
            y: 160
            bg_color: 0xe74c3c
            bg_opa: COVER
            radius: 20
            shadow_width: 6
            shadow_color: 0xe74c3c
            shadow_opa: 80%
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "⏹️  STOP STREAMING");
                    id(tab5_cam).stop_streaming();
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_24
                  text_align: CENTER

# ==============================================================
# POURQUOI 1288×728 EST PARFAIT
# ==============================================================
#
# ✅ AVANTAGES:
#    - Format NATIF du driver OV02C10
#    - 0% crop du sensor (ratio 16:9 natif)
#    - Pas de zoom (100% FOV visible vs 75% avec 640×480)
#    - Taille raisonnable: ~1.8 MB (vs 6 MB pour 1920×1080)
#    - PPA downscale seulement (728→480, 1288→390) - PAS d'upscale
#    - Pas de lignes transparentes
#    - Pas de compression
#    - Canvas IDENTIQUE à votre config actuelle (480×390)
#    - Boutons IDENTIQUES (aucun repositionnement)
#
# 📐 DIMENSIONS:
#    - Capture: 1288×728 (format natif 16:9)
#    - Après rotation 270°: 728×1288
#    - PPA downscale: 728→480 (66%), 1288→390 (30%)
#    - Canvas final: 480×390
#    - Position: x=30, y=40 (votre config actuelle)
#
# 🔍 COMPARAISON:
#    | Format | FOV | Crop | RAM | Canvas | Problèmes |
#    |--------|-----|------|-----|--------|-----------|
#    | 640×480 | 75% | 25% | 1.2 MB | 480×390 | ❌ Zoom 1.33x |
#    | 640×368 | 98% | 2% | 0.9 MB | 368×390 | ❌ Upscale → lignes |
#    | **1288×728** | **100%** | **0%** | **1.8 MB** | **480×390** | ✅ **AUCUN** |
#    | 1920×1080 | 100% | 0% | 6.2 MB | 480×390 | ⚠️ Beaucoup de RAM |
#
# 🎯 CHANGEMENT REQUIS:
#    SEULEMENT UNE LIGNE:
#    resolution: "1288x728"  # ← De "640x480" à "1288x728"
#
#    TOUT LE RESTE IDENTIQUE!
#

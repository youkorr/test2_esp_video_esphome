# ========================================================================
# CORRECTION : on_load pour security_page
# ========================================================================
# Le canvas doit être initialisé APRÈS que LVGL l'ait créé
# ========================================================================

      - id: security_page
        bg_color: 0x1a1a1a
        on_load:
          - delay: 100ms  # ← AJOUTÉ: Attendre que LVGL crée le canvas
          - lambda: |-
              ESP_LOGI("security", "Security page loaded");
              static bool canvas_configured = false;
              if (!canvas_configured) {
                auto canvas = id(security_canvas);
                if (canvas != nullptr) {
                  // Vérifier que le canvas a une taille valide
                  lv_coord_t w = lv_obj_get_width(canvas);
                  lv_coord_t h = lv_obj_get_height(canvas);
                  ESP_LOGI("security", "Canvas size: %dx%d", w, h);

                  if (w > 0 && h > 0) {
                    id(security_display).configure_canvas(canvas);
                    canvas_configured = true;
                    ESP_LOGI("security", "✓ Security canvas configured");
                  } else {
                    ESP_LOGE("security", "Canvas size is invalid: %dx%d", w, h);
                  }
                } else {
                  ESP_LOGE("security", "Canvas is nullptr!");
                }
              }

# ========================================================================
# ALTERNATIVE : Utiliser un bouton pour configurer manuellement
# ========================================================================
# Si le delay ne fonctionne pas, ajoutez un bouton "INIT" :

          - button:
              id: btn_init_canvas
              width: 80
              height: 30
              x: 690
              y: 400
              bg_color: 0xf39c12
              bg_opa: COVER
              radius: 15
              on_click:
                then:
                  - lambda: |-
                      auto canvas = id(security_canvas);
                      if (canvas != nullptr) {
                        lv_coord_t w = lv_obj_get_width(canvas);
                        lv_coord_t h = lv_obj_get_height(canvas);
                        ESP_LOGI("security", "Manual init - Canvas size: %dx%d", w, h);
                        id(security_display).configure_canvas(canvas);
                        ESP_LOGI("security", "✓ Canvas configured manually");
                      }
              widgets:
                - label:
                    text: "INIT"
                    text_color: 0xFFFFFF
                    text_font: nunito_20
                    text_align: CENTER
                    align: CENTER

# ========================================================================
# ALTERNATIVE 2 : Configurer dans le bouton START
# ========================================================================
# Au lieu de on_load, configurez le canvas quand START est cliqué :

          - button:
              id: btn_start_all
              # ... (vos paramètres existants)
              on_click:
                then:
                  - lambda: |-
                      // Configurer le canvas si pas encore fait
                      static bool canvas_configured = false;
                      if (!canvas_configured) {
                        auto canvas = id(security_canvas);
                        if (canvas != nullptr) {
                          id(security_display).configure_canvas(canvas);
                          canvas_configured = true;
                          ESP_LOGI("security", "✓ Canvas configured on START");
                        }
                      }

                      // Démarrer les caméras
                      ESP_LOGI("security", "Starting all cameras");
                      id(security_cam_1).set_enabled(true);
                      id(cam1_state) = true;

# ========================================================================
# RECOMMANDATION : Utilisez l'alternative 2 (dans le bouton START)
# ========================================================================
# C'est la solution la plus fiable car :
# 1. Le canvas est garanti d'être créé quand l'utilisateur clique
# 2. Évite les problèmes de timing avec on_load
# 3. Plus simple à déboguer
# ========================================================================

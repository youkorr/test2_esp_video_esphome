# ============================================================================
# EXEMPLES D'UTILISATION DANS LVGL PAGES
# ============================================================================

lvgl:
  displays:
    - display_id: my_display
      pages:
        - id: page_home
          widgets:
            # ========== Animation Loading en haut à droite ==========
            - animimg:
                id: loading_spinner
                align: TOP_RIGHT
                x: -20
                y: 20
                width: 100
                height: 100
                src:
                  - loading_f01
                  - loading_f02
                  - loading_f03
                  - loading_f04
                  - loading_f05
                  - loading_f06
                  - loading_f07
                  - loading_f08
                duration: 800        # 800ms pour cycle complet
                repeat_count: -1     # Boucle infinie
                auto_start: true     # Démarre automatiquement

            # ========== Animation Alarm (conditionnelle) ==========
            - animimg:
                id: alarm_icon
                align: TOP_LEFT
                x: 20
                y: 20
                width: 64
                height: 64
                src:
                  - alarm_f01
                  - alarm_f02
                  - alarm_f03
                  - alarm_f04
                  - alarm_f05
                  - alarm_f06
                duration: 600
                repeat_count: 3      # 3 cycles puis stop
                auto_start: false    # Contrôlé par automation

            # ========== Animation Heart avec bouton toggle ==========
            - obj:
                id: heart_container
                align: CENTER
                width: 120
                height: 120
                bg_color: 0x000000
                bg_opa: TRANSP
                border_width: 0
                widgets:
                  - animimg:
                      id: heart_beat
                      align: CENTER
                      width: 80
                      height: 80
                      src:
                        - heart_f01
                        - heart_f02
                        - heart_f03
                        - heart_f04
                        - heart_f05
                        - heart_f06
                        - heart_f07
                        - heart_f08
                        - heart_f09
                        - heart_f10
                        - heart_f11
                        - heart_f12
                      duration: 1200
                      repeat_count: -1
                      auto_start: true

            # ========== Bouton pour contrôler heart animation ==========
            - button:
                id: btn_heart_toggle
                align: BOTTOM_MID
                y: -20
                width: 150
                height: 50
                checkable: true
                widgets:
                  - label:
                      text: "Toggle Heart"
                      align: CENTER
                on_press:
                  - lvgl.animimg.start:
                      id: heart_beat
                on_release:
                  - lvgl.animimg.stop:
                      id: heart_beat


# ============================================================================
# EXEMPLES D'AUTOMATIONS POUR CONTRÔLER LES ANIMATIONS
# ============================================================================

# Exemple 1: Démarrer loading_spinner quand WiFi se connecte
on_wifi_connecting:
  - lvgl.animimg.start:
      id: loading_spinner

on_wifi_connected:
  - lvgl.animimg.stop:
      id: loading_spinner

# Exemple 2: Déclencher alarm sur événement sensor
binary_sensor:
  - platform: gpio
    pin: GPIO15
    name: "Door Sensor"
    on_press:
      - lvgl.animimg.start:
          id: alarm_icon

# Exemple 3: Contrôler animation depuis Home Assistant
switch:
  - platform: template
    name: "Heart Animation"
    turn_on_action:
      - lvgl.animimg.start:
          id: heart_beat
    turn_off_action:
      - lvgl.animimg.stop:
          id: heart_beat


# ============================================================================
# NOTES DE PERFORMANCE
# ============================================================================
#
# RAM Usage (par animation chargée):
# - 100x100 RGB565 = 20KB par frame
# - Animation 8 frames = 160KB total
# - IMPORTANT: Utiliser auto_load: false si mémoire limitée
#
# Optimisations:
# 1. Charger/décharger dynamiquement:
#    - storage.load_image: loading_f01
#    - storage.unload_image: loading_f01
#
# 2. Réduire le nombre de frames (8→4 frames = 50% moins RAM)
#
# 3. Réduire la taille (100x100→64x64 = 60% moins RAM)
#
# 4. Utiliser format L8 (grayscale) si possible:
#    - RGB565 = 2 bytes/pixel
#    - L8 = 1 byte/pixel (50% moins RAM)
#
# ============================================================================

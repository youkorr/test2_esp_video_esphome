output:
  - platform: ledc
    pin: GPIO32
    id: backlight_pwm
    frequency: 1000Hz
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bsp_bus
    reset_pin: GPIO23
    update_interval: 50ms   # polling (pas d'interruption)
    on_touch:
      - lambda: |-
          ESP_LOGD("touchscreen", "Touch detected at (%d, %d)", touch.x, touch.y);
      - light.turn_on: backlight           
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

  
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    reset_pin:
      number: 33
    rotation: 180
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600



 

lvgl:
  buffer_size: 100%
  byte_order: little_endian
  displays:
    - main_display
  touchscreens:
    - touch

  style_definitions:
    - id: page_content
      bg_color: 0x000000
      width: 100%
      height: 100%
      pad_all: 0
      pad_row: 0
      pad_column: 0


    - id: button_style
      bg_color: 0x000000 #black
      bg_grad_color: 0x005782 #blue
      bg_grad_dir: VER
      bg_opa: COVER
      border_color: 0x000000
      border_width: 1
      text_color: 0xFFFFFF
      ############## ADD SHADOW
      shadow_color: 0xFFFFFF
      shadow_width: 20
      shadow_offset_x: 0
      shadow_offset_y: 0
      shadow_opa: 50%
      radius: 40
      
    - id: button_pressed_style
      bg_color: 0x666666 #grey
      bg_grad_color: 0x00334d #dark blue
      ############## ADD SHADOW
      shadow_color: 0xFFFFFF
      shadow_width: 20
      shadow_offset_x: 0
      shadow_offset_y: 0
      shadow_opa: 50%
      radius: 40
      
    - id: button_checked_style
      bg_color: 0x000000 #black
      bg_grad_color: 0x002233 #darker blue
      bg_grad_dir: VER
      text_color: yellow
      ############## ADD SHADOW
      shadow_color: 0xFFFFFF
      shadow_width: 20
      shadow_offset_x: 0
      shadow_offset_y: 0
      shadow_opa: 50%
      radius: 40
      
    - id: button_standard_style
      bg_color: 0x2F8CD8
      bg_grad_color: 0x005782
      shadow_width: 0

    - id: round_mask
      radius: 50%  # Crée un cercle parfait
      clip_corner: true


    - id: menu_button
      radius: 40      

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true
  slot: 1

i2c:
  - id: bsp_bus
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz 

image:

  defaults:
    byte_order: little_endian
    transparency: alpha_channel
    type: rgb565


external_components:
  - source: github://pr#11886
    components: [mipi_dsi]
    refresh: always
 


  - source:
      type: git
      url: https://github.com/youkorr/test2_esp_video_esphome
      ref: claude/fix-lvgl-watchdog-crash-AGRWh
    components: [lvgl, image, font, esp_video, esp_cam_sensor, sd_mmc_card, webdavbox3]
    refresh: always   

psram:
  mode: hex
  speed: 200MHz


esp_ldo:
  - voltage: 2.5V
    channel: 3
  - voltage: 2.5V
    channel: 4   


esp_video:
  i2c_id: bsp_bus
  xclk_pin: GPIO36
  xclk_freq: 24000000
  enable_h264: true
  enable_jpeg: true
  enable_isp: true
  use_heap_allocator: true

esp_cam_sensor:
  id: tab5_cam
  i2c_id: bsp_bus
  sensor_type: ov5647        #"sensor_type" au lieu de "sensor"
  resolution: "640x480"          # 800x640 , 1024x600 ,vga
  pixel_format: "RGB565"      # Zero-copy 
  framerate: 30
  jpeg_quality: 15
  mirror_x: false    # Flip horizontal (hardware)
  mirror_y: false      # Flip vertical
  rotation: 0          # 0/90/180/270°
  crop_offset_x: 0     # Crop pixels from left






# ============================================================================

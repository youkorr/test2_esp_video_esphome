# ============================================================================    
webdavbox3:
  id: sd_cards
  root_path: "/sdcard"
  url_prefix: "/"
  port: 81
  username: "youkorr"
  password: "youkorr"


#ppa_accelerator:
  #id: ppa

# ============================================================================
# sd_mmc_card
# ===========================================================================
sd_mmc_card:
  id: sd_card
  clk_pin: GPIO43
  cmd_pin: GPIO44
  data0_pin: GPIO39
  data1_pin: GPIO40
  data2_pin: GPIO41
  data3_pin: GPIO42
  mode_1bit: false
  slot: 0  


## ESP-IDF Component Manager configuration
## This file enables ThorVG external component from Espressif
##
## IMPORTANT for PlatformIO users:
## PlatformIO with ESP-IDF framework DOES support idf_component.yml
## The component manager will download ThorVG to managed_components/

dependencies:
  espressif/thorvg: "^0.15.16"
  idf: ">=5.0"

description: LVGL 9.4 graphics library with ThorVG vector graphics support
url: https://lvgl.io/
version: 9.4.0

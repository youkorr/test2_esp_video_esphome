# Example with Different Resolutions
# ============================================================================

# For 1280x720:
#
# camera_display:
#   id: my_camera
#   sensor_name: sc202cs
#   width: 1280
#   height: 720
#   buffer_count: 2
#
# lvgl:
#   pages:
#     - widgets:
#         - canvas:
#             id: camera_canvas
#             width: 1280  # ← MUST match camera
#             height: 720  # ← MUST match camera

# ============================================================================
# Example with Position Offset (for smaller screens)
# ============================================================================

# For displaying 800x600 on 1024x600 screen (centered):
#
# lvgl:
#   pages:
#     - widgets:
#         - canvas:
#             id: camera_canvas
#             width: 800
#             height: 600
#             x: 112  # (1024-800)/2 = center horizontally
#             y: 0

# ============================================================================
# Performance Notes
# ============================================================================
#
# Expected FPS:
#   - SC202CS 800x600:   25-30 FPS ✅
#   - SC202CS 1280x720:  25-30 FPS ✅
#   - OV5647 800x600:    25-30 FPS ✅
#
# If you get <15 FPS, check:
#   1. Canvas size matches camera resolution
#   2. Logs show "Streaming: X frames (25.3 FPS)"
#   3. No "Failed to dequeue buffer" errors
#
# Buffer count recommendations:
#   - 2 buffers: Lowest latency (recommended)
#   - 3 buffers: More stable under CPU load
#   - 4+ buffers: Usually unnecessary
#
# ============================================================================

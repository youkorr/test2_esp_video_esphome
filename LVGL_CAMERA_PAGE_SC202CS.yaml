# Page LVGL simplifiée pour caméra SC202CS
# Résolutions supportées: 800x600 (SVGA) ou 720P (1280x720)
# 800x600 = Meilleure performance (moins de bande passante, meilleur FPS)
# 720P = Plus haute résolution (consomme plus de ressources)
# Contrôles: BACK, START, STOP, INFO

# ============================================
# VERSION 1: SVGA 800x600 - RECOMMANDÉ pour meilleur FPS
# ============================================
lvgl:
  pages:
    - id: camera_page_svga
      bg_color: 0x000000

      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Page caméra SC202CS SVGA chargée");
            ESP_LOGI("camera", "Canvas: 800x480 (image 800x600 cropée en hauteur)");

            // Optionnel: démarrer automatiquement le streaming
            // Décommentez pour auto-start:
            // if (id(tab5_cam).start_streaming()) {
            //   lv_label_set_text(id(status_label), "SVGA");
            // }

      widgets:
        # Canvas 800x480 plein écran (800x600 crop de 120px en hauteur)
        - canvas:
            id: camera_canvas
            width: 800
            height: 480
            x: 0
            y: 0
            bg_color: 0x000000

        # Bouton RETOUR
        - button:
            id: btn_camera_back
            width: 70
            height: 45
            x: 5
            y: 10
            bg_color: 0x333333
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Retour");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton START
        - button:
            id: btn_start
            width: 70
            height: 45
            x: 5
            y: 65
            bg_color: 0x00AA00
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  START SC202CS");
                    if (id(tab5_cam).start_streaming()) {
                      lv_label_set_text(id(status_label), "SVGA");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton STOP
        - button:
            id: btn_stop
            width: 70
            height: 45
            x: 5
            y: 120
            bg_color: 0xCC0000
            radius: 8
            on_click:
              then:
                - lambda: |-
                    id(tab5_cam).stop_streaming();
                    lv_label_set_text(id(status_label), "STOP");
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton INFO
        - button:
            id: btn_info
            width: 70
            height: 45
            x: 5
            y: 175
            bg_color: 0x4682B4
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "📊 === INFORMATIONS CAMÉRA ===");
                    ESP_LOGI("camera", "Sensor: SC202CS");
                    ESP_LOGI("camera", "Résolution configurée: 800x600 (SVGA)");

                    // Résolution runtime
                    int w = id(tab5_cam).get_image_width();
                    int h = id(tab5_cam).get_image_height();
                    if (w > 0 && h > 0) {
                      ESP_LOGI("camera", "Résolution runtime: %dx%d", w, h);
                      ESP_LOGI("camera", "Streaming: ACTIF");
                    } else {
                      ESP_LOGI("camera", "Streaming: ARRÊTÉ");
                    }

                    ESP_LOGI("camera", "Format: RGB565 (converti depuis RAW8 BGGR)");
                    ESP_LOGI("camera", "Canvas: 800x480 (crop 120px hauteur)");
                    ESP_LOGI("camera", "Bayer: BGGR (RAW8)");
                    ESP_LOGI("camera", "Capteur crop: 808x608 centré sur 1600x1200 → 800x600");
                    ESP_LOGI("camera", "Timing: HTS=1920, VTS=1250, PCLK=72MHz → 30fps");
                    ESP_LOGI("camera", "MIPI: 1-lane CSI @ 576 Mbps");
                    ESP_LOGI("camera", "Adresse I2C: 0x36");
            widgets:
              - label:
                  text: "INFO"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Status
        - label:
            id: status_label
            text: "READY"
            x: 40
            y: 450
            text_color: 0xFF8800
            text_font: nunito_20

# ============================================
# VERSION 2: 720P (1280x720) - Plus haute résolution
# ============================================
# Utilisez 720P si vous avez besoin de plus de détails
# Note: Consomme plus de bande passante et réduit le FPS
# Pour activer 720P:
# 1. Changez resolution: "800x600" → resolution: "720P" ci-dessous
# 2. Canvas reste 800x480 (redimensionnement automatique)

# ============================================
# CONFIGURATION CAMÉRA SC202CS
# ============================================
# NOTE: Les noms de bus I2C sont configurables
# Remplacez 'bsp_bus' par le nom de votre bus I2C

# mipi_dsi_cam:
#   id: tab5_cam
#   i2c_id: bsp_bus            # ← CHANGEZ selon votre configuration I2C
#   sensor_type: sc202cs
#   sensor_addr: 0x36          # OV02C10, OV5647, SC202CS = tous 0x36
#   resolution: "800x600"      # ✅ RECOMMANDÉ (SVGA - meilleur FPS, moins de bande passante)
#   pixel_format: RGB565
#   framerate: 30

# lvgl_camera_display:
#   id: camera_display
#   camera_id: tab5_cam
#   canvas_id: camera_canvas
#   update_interval: 100ms     # 10 FPS (évite watchdog timeout)

# NOTES IMPORTANTES SC202CS:
# ✅ Résolution RECOMMANDÉE: 800x600 (SVGA) - meilleur FPS et performance
# ✅ Alternative: 720P (1280x720) - plus haute résolution mais FPS réduit
# ❌ VGA 640x480 N'EST PAS SUPPORTÉ par ce capteur !
#
# Résolutions disponibles:
#   - 800x600 (SVGA) @ 30fps - ✅ RECOMMANDÉ (format index 0, économe)
#   - 720P (1280x720) @ 30fps - ✅ OK (format index 1, défaut driver)
#   - 1600x1200 @ 30fps - Résolution native complète (haute mémoire)
#
# Mémoire: 800x600 ≈ 960 KB, 720P ≈ 1.8 MB
# Bande passante: 800x600 ≈ 46 MB/s, 720P ≈ 88 MB/s
# SC202CS utilise 1-lane MIPI CSI @ 576 Mbps (vs 2-lane pour OV5647/OV02C10)
# Résolution native capteur: 1600x1200 (crop centré pour toutes résolutions)

# Page LVGL simplifiée pour caméra SC202CS
# Résolutions supportées: 800x600 (natif SVGA) ou 720P (1280x720)
# IMPORTANT: SC202CS ne supporte PAS 640x480 VGA !
# Contrôles: BACK, START, STOP, INFO

# ============================================
# VERSION 1: SVGA 800x600 (recommandé - résolution native SC202CS)
# ============================================
lvgl:
  pages:
    - id: camera_page_svga
      bg_color: 0x000000

      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Page caméra SC202CS SVGA chargée");
            ESP_LOGI("camera", "Canvas: 800x600 plein écran");

            // Optionnel: démarrer automatiquement le streaming
            // Décommentez pour auto-start:
            // if (id(tab5_cam).start_streaming()) {
            //   lv_label_set_text(id(status_label), "SVGA");
            // }

      widgets:
        # Canvas SVGA 800x600 (dépasse de 120px en hauteur - scroll ou crop nécessaire)
        - canvas:
            id: camera_canvas
            width: 800
            height: 600
            x: 0    # Plein écran largeur
            y: 0
            bg_color: 0x000000

        # Bouton RETOUR
        - button:
            id: btn_camera_back
            width: 70
            height: 45
            x: 5
            y: 10
            bg_color: 0x333333
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Retour");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton START
        - button:
            id: btn_start
            width: 70
            height: 45
            x: 5
            y: 65
            bg_color: 0x00AA00
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  START SC202CS");
                    if (id(tab5_cam).start_streaming()) {
                      lv_label_set_text(id(status_label), "SVGA");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton STOP
        - button:
            id: btn_stop
            width: 70
            height: 45
            x: 5
            y: 120
            bg_color: 0xCC0000
            radius: 8
            on_click:
              then:
                - lambda: |-
                    id(tab5_cam).stop_streaming();
                    lv_label_set_text(id(status_label), "STOP");
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton INFO
        - button:
            id: btn_info
            width: 70
            height: 45
            x: 5
            y: 175
            bg_color: 0x4682B4
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "📊 === INFORMATIONS CAMÉRA ===");
                    ESP_LOGI("camera", "Sensor: SC202CS");
                    ESP_LOGI("camera", "Résolution configurée: 800x600 (SVGA)");

                    // Résolution runtime
                    int w = id(tab5_cam).get_image_width();
                    int h = id(tab5_cam).get_image_height();
                    if (w > 0 && h > 0) {
                      ESP_LOGI("camera", "Résolution runtime: %dx%d", w, h);
                      ESP_LOGI("camera", "Streaming: ACTIF");
                    } else {
                      ESP_LOGI("camera", "Streaming: ARRÊTÉ");
                    }

                    ESP_LOGI("camera", "Format: RGB565 (converti depuis RAW8 BGGR)");
                    ESP_LOGI("camera", "Canvas: 800x600 plein écran");
                    ESP_LOGI("camera", "Bayer: BGGR (RAW8)");
                    ESP_LOGI("camera", "Crop: Centré sur 1600x1200 (résolution native)");
                    ESP_LOGI("camera", "MIPI: 1-lane CSI");
                    ESP_LOGI("camera", "Adresse I2C: 0x36");
            widgets:
              - label:
                  text: "INFO"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Status
        - label:
            id: status_label
            text: "READY"
            x: 40
            y: 450
            text_color: 0xFF8800
            text_font: nunito_20


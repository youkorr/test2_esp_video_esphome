# Page LVGL simplifiée pour caméra SC202CS
# Résolution RECOMMANDÉE: 720P (1280x720) - testé et stable
# IMPORTANT: 800x600 cause des saccades - évitez cette résolution !
# Contrôles: BACK, START, STOP, INFO

# ============================================
# VERSION 1: 720P (1280x720) - RECOMMANDÉ pour SC202CS
# ============================================
# Note: 720P sera redimensionné pour s'adapter à l'écran 800x480
lvgl:
  pages:
    - id: camera_page_720p
      bg_color: 0x000000

      on_load:
        - lambda: |-
            ESP_LOGI("camera", "📸 Page caméra SC202CS 720P chargée");
            ESP_LOGI("camera", "Canvas: 800x480 plein écran (redimensionné depuis 1280x720)");

            // Optionnel: démarrer automatiquement le streaming
            // Décommentez pour auto-start:
            // if (id(tab5_cam).start_streaming()) {
            //   lv_label_set_text(id(status_label), "720P");
            // }

      widgets:
        # Canvas 800x480 plein écran (image 720P redimensionnée)
        - canvas:
            id: camera_canvas
            width: 800
            height: 480
            x: 0
            y: 0
            bg_color: 0x000000

        # Bouton RETOUR
        - button:
            id: btn_camera_back
            width: 70
            height: 45
            x: 5
            y: 10
            bg_color: 0x333333
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "🔙 Retour");
                    id(tab5_cam).stop_streaming();
                - lvgl.page.show: page_home
            widgets:
              - label:
                  text: "BACK"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton START
        - button:
            id: btn_start
            width: 70
            height: 45
            x: 5
            y: 65
            bg_color: 0x00AA00
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "▶️  START SC202CS");
                    if (id(tab5_cam).start_streaming()) {
                      lv_label_set_text(id(status_label), "720P");
                    }
            widgets:
              - label:
                  text: "START"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton STOP
        - button:
            id: btn_stop
            width: 70
            height: 45
            x: 5
            y: 120
            bg_color: 0xCC0000
            radius: 8
            on_click:
              then:
                - lambda: |-
                    id(tab5_cam).stop_streaming();
                    lv_label_set_text(id(status_label), "STOP");
            widgets:
              - label:
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Bouton INFO
        - button:
            id: btn_info
            width: 70
            height: 45
            x: 5
            y: 175
            bg_color: 0x4682B4
            radius: 8
            on_click:
              then:
                - lambda: |-
                    ESP_LOGI("camera", "📊 === INFORMATIONS CAMÉRA ===");
                    ESP_LOGI("camera", "Sensor: SC202CS");
                    ESP_LOGI("camera", "Résolution configurée: 1280x720 (720P)");

                    // Résolution runtime
                    int w = id(tab5_cam).get_image_width();
                    int h = id(tab5_cam).get_image_height();
                    if (w > 0 && h > 0) {
                      ESP_LOGI("camera", "Résolution runtime: %dx%d", w, h);
                      ESP_LOGI("camera", "Streaming: ACTIF");
                    } else {
                      ESP_LOGI("camera", "Streaming: ARRÊTÉ");
                    }

                    ESP_LOGI("camera", "Format: RGB565 (converti depuis RAW8 BGGR)");
                    ESP_LOGI("camera", "Canvas: 800x480 plein écran");
                    ESP_LOGI("camera", "Bayer: BGGR (RAW8)");
                    ESP_LOGI("camera", "Crop: Centré sur 1600x1200 (résolution native)");
                    ESP_LOGI("camera", "MIPI: 1-lane CSI");
                    ESP_LOGI("camera", "Adresse I2C: 0x36");
            widgets:
              - label:
                  text: "INFO"
                  text_color: 0xFFFFFF
                  text_font: nunito_18
                  text_align: CENTER

        # Status
        - label:
            id: status_label
            text: "READY"
            x: 40
            y: 450
            text_color: 0xFF8800
            text_font: nunito_20

# ============================================
# VERSION 2: 800x600 SVGA (NON RECOMMANDÉ - cause des saccades)
# ============================================
# AVERTISSEMENT: La résolution 800x600 cause des déformations et saccades
# avec le SC202CS. Utilisez 720P à la place.
#
# Raison: Le format 800x600 est défini deux fois (driver natif + custom),
# ce qui crée des conflits de timing.
#
# Si vous voulez absolument tester 800x600:
# 1. Changez resolution: "720P" → resolution: "800x600" ci-dessous
# 2. Ajustez le canvas à 800x600
# 3. Attendez-vous à des problèmes de performance

# ============================================
# CONFIGURATION CAMÉRA SC202CS
# ============================================
# NOTE: Les noms de bus I2C sont configurables
# Remplacez 'bsp_bus' par le nom de votre bus I2C

# mipi_dsi_cam:
#   id: tab5_cam
#   i2c_id: bsp_bus            # ← CHANGEZ selon votre configuration I2C
#   sensor_type: sc202cs
#   sensor_addr: 0x36          # OV02C10, OV5647, SC202CS = tous 0x36
#   resolution: "720P"         # ✅ RECOMMANDÉ (1280x720 - stable et testé)
#   pixel_format: RGB565
#   framerate: 30

# lvgl_camera_display:
#   id: camera_display
#   camera_id: tab5_cam
#   canvas_id: camera_canvas
#   update_interval: 100ms     # 10 FPS (évite watchdog timeout)

# NOTES IMPORTANTES SC202CS:
# ✅ Résolution RECOMMANDÉE: 720P (1280x720) - format par défaut testé
# ⚠️  ÉVITEZ 800x600 - cause des saccades et déformations (conflit de format)
# ❌ VGA 640x480 N'EST PAS SUPPORTÉ par ce capteur !
#
# Résolutions disponibles:
#   - 720P (1280x720) @ 30fps - ✅ RECOMMANDÉ (format index 1, défaut driver)
#   - 800x600 @ 30fps - ⚠️  Instable (format index 0, conflits)
#   - 1600x1200 @ 30fps - Résolution native complète (haute mémoire)
#
# Mémoire: 720P ≈ 1.8 MB, 800x600 ≈ 960 KB
# SC202CS utilise 1-lane MIPI CSI (vs 2-lane pour OV5647/OV02C10)
# Résolution native capteur: 1600x1200 (crop centré pour 720P et 800x600)

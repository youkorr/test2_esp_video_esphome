# ============================================
# CONFIGURATION CAMÉRA SC202CS
# ============================================
# NOTE: Les noms de bus I2C sont configurables
# Remplacez 'bsp_bus' par le nom de votre bus I2C

# mipi_dsi_cam:
#   id: tab5_cam
#   i2c_id: bsp_bus            # ← CHANGEZ selon votre configuration I2C
#   sensor_type: sc202cs
#   sensor_addr: 0x36          # OV02C10, OV5647, SC202CS = tous 0x36
#   resolution: "800x600"      # Résolution native SVGA (ou "720P" pour 1280x720)
#   pixel_format: RGB565
#   framerate: 30

# lvgl_camera_display:
#   id: camera_display
#   camera_id: tab5_cam
#   canvas_id: camera_canvas
#   update_interval: 100ms     # 10 FPS (évite watchdog timeout)

# NOTES IMPORTANTES SC202CS:
# - Résolutions supportées: 800x600 (SVGA natif) ou 1280x720 (720P)
# - ATTENTION: VGA 640x480 N'EST PAS SUPPORTÉ par ce capteur !
# - Mémoire SVGA: ~960 KB vs 1.8 MB pour 720P
# - SC202CS utilise 1-lane MIPI CSI (vs 2-lane pour OV5647/OV02C10)
# - Résolution native: 1600x1200 (crop centré pour 800x600 et 720P)
